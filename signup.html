<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 회원가입</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; text-decoration: none; }
    .logo span { color: #222; }
    .wrap { max-width: 480px; margin: 48px auto; padding: 0 24px; }
    .card { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 36px; }
    h2 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .type-btns { display: flex; gap: 10px; margin-bottom: 24px; }
    .type-btn { flex: 1; padding: 12px; border: 2px solid #e9ecef; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 600; color: #888; cursor: pointer; text-align: center; transition: all 0.15s; position: relative; z-index: 1; }
    .type-btn.active { border-color: #1D9E75; color: #1D9E75; background: #e8f8f2; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input, select { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #222; background: #fff; }
    input:focus, select:focus { outline: none; border-color: #1D9E75; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .upload-area { border: 2px dashed #ddd; border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.15s; }
    .upload-area:hover { border-color: #1D9E75; }
    .upload-area p { font-size: 13px; color: #999; }
    .upload-area .hint { font-size: 11px; color: #bbb; margin-top: 4px; }
    #uploadedName { font-size: 12px; color: #1D9E75; margin-top: 8px; display: none; }
    .instructor-only { display: none; }
    .btn-submit { width: 100%; padding: 14px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-submit:hover { background: #178a65; }
    .login-link { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
    .login-link a { color: #1D9E75; font-weight: 600; text-decoration: none; }
    .error { color: #e53935; font-size: 12px; margin-top: 6px; display: none; }
    .notice { background: #e8f8f2; border: 1px solid #9FE1CB; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #0F6E56; margin-bottom: 16px; display: none; }
    #licenseOtherGroup { display: none; margin-top: 8px; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
</nav>

<div class="wrap">
  <div class="card">
    <h2>회원가입</h2>
    <p class="sub">FreeBuddy와 함께 프리다이빙을 즐겨보세요</p>

    <div class="type-btns">
      <button type="button" class="type-btn active" onclick="setType('member')">🤿 일반 회원</button>
      <button type="button" class="type-btn" onclick="setType('instructor')">🏅 강사</button>
    </div>

    <div class="notice" id="instructorNotice">
      강사 회원은 자격증 확인 후 승인됩니다. 승인까지 1~2일 소요될 수 있습니다.
    </div>

    <div class="form-group">
      <label>아이디</label>
      <input type="text" id="username" placeholder="영문, 숫자 조합 4자 이상">
      <div class="error" id="usernameErr">아이디를 입력해주세요</div>
    </div>

    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="email" placeholder="example@email.com">
      <div class="error" id="emailErr">이메일을 입력해주세요</div>
    </div>

    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="password" placeholder="8자 이상">
      <div class="error" id="passwordErr">비밀번호를 8자 이상 입력해주세요</div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>자격증 종류</label>
        <select id="licenseType" onchange="checkOtherLicense()">
          <option value="">선택</option>
          <option value="AIDA">AIDA</option>
          <option value="SSI">SSI</option>
          <option value="PADI">PADI</option>
          <option value="CMAS">CMAS</option>
          <option value="기타">기타</option>
        </select>
        <div id="licenseOtherGroup">
          <input type="text" id="licenseOther" placeholder="자격증 이름 직접 입력">
        </div>
      </div>
      <div class="form-group">
        <label>레벨</label>
        <select id="licenseLevel">
          <option value="">선택</option>
          <option value="입문">입문 (Free Diver)</option>
          <option value="중급">중급 (Advanced)</option>
          <option value="상급">상급 (Master)</option>
          <option value="강사">강사 (Instructor)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>활동 지역</label>
      <select id="region">
        <option value="">선택</option>
        <option value="서울">서울</option>
        <option value="경기">경기</option>
        <option value="인천">인천</option>
        <option value="강원">강원</option>
        <option value="충청">충청</option>
        <option value="대전">대전</option>
        <option value="세종">세종</option>
        <option value="전라">전라</option>
        <option value="광주">광주</option>
        <option value="경상">경상</option>
        <option value="부산">부산</option>
        <option value="대구">대구</option>
        <option value="울산">울산</option>
        <option value="제주">제주</option>
      </select>
    </div>

    <div class="instructor-only" id="instructorSection">
      <div class="form-group">
        <label>한 줄 소개</label>
        <input type="text" id="intro" placeholder="강사 소개를 입력해주세요">
      </div>
      <div class="form-group">
        <label>연락처 (카카오 오픈채팅 링크 등)</label>
        <input type="text" id="contact" placeholder="https://open.kakao.com/...">
      </div>
      <div class="form-group">
        <label>자격증 사진 업로드 <span style="color:#e53935">*</span></label>
        <div class="upload-area" onclick="document.getElementById('licenseFile').click()">
          <p>📎 클릭하여 자격증 사진 업로드</p>
          <p class="hint">JPG, PNG 파일 / 최대 5MB</p>
          <div id="uploadedName"></div>
        </div>
        <input type="file" id="licenseFile" accept="image/*" style="display:none" onchange="showFileName()">
        <div class="error" id="licenseErr">자격증 사진을 업로드해주세요</div>
      </div>
    </div>

    <div class="error" id="generalErr"></div>
    <button class="btn-submit" onclick="signup()">가입하기</button>

    <div class="login-link">
      이미 계정이 있으신가요? <a href="login.html">로그인</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let userType = 'member';

  function setType(type) {
    userType = type;
    document.querySelectorAll('.type-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (i === 0 && type === 'member') || (i === 1 && type === 'instructor'));
    });
    const show = type === 'instructor';
    document.getElementById('instructorSection').style.display = show ? 'block' : 'none';
    document.getElementById('instructorNotice').style.display = show ? 'block' : 'none';
  }

  function checkOtherLicense() {
    const val = document.getElementById('licenseType').value;
    document.getElementById('licenseOtherGroup').style.display = val === '기타' ? 'block' : 'none';
  }

  function showFileName() {
    const file = document.getElementById('licenseFile').files[0];
    if (file) {
      const el = document.getElementById('uploadedName');
      el.textContent = '✅ ' + file.name;
      el.style.display = 'block';
    }
  }

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideAllErr() {
    document.querySelectorAll('.error').forEach(e => e.style.display = 'none');
  }

  async function signup() {
    hideAllErr();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let licenseType = document.getElementById('licenseType').value;
    if (licenseType === '기타') {
      const other = document.getElementById('licenseOther').value.trim();
      if (other) licenseType = other;
    }
    const licenseLevel = document.getElementById('licenseLevel').value;
    const region = document.getElementById('region').value;
    const intro = document.getElementById('intro').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const licenseFile = document.getElementById('licenseFile').files[0];

    let valid = true;
    if (!username) { showErr('usernameErr', '아이디를 입력해주세요'); valid = false; }
    if (!email) { showErr('emailErr', '이메일을 입력해주세요'); valid = false; }
    if (password.length < 8) { showErr('passwordErr', '비밀번호를 8자 이상 입력해주세요'); valid = false; }
    if (userType === 'instructor' && !licenseFile) { showErr('licenseErr', '자격증 사진을 업로드해주세요'); valid = false; }
    if (!valid) return;

    const btn = document.querySelector('.btn-submit');
    btn.textContent = '처리 중...';
    btn.disabled = true;

    try {
      const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
      if (authError) throw authError;

      const userId = authData.user.id;
      let licenseImageUrl = null;

      if (userType === 'instructor' && licenseFile) {
        const ext = licenseFile.name.split('.').pop();
        const path = `${userId}/license.${ext}`;
        const { error: uploadError } = await supabase.storage.from('licenses').upload(path, licenseFile);
        if (uploadError) throw uploadError;
        licenseImageUrl = path;
      }

      const { error: profileError } = await supabase.from('profiles').insert({
        id: userId,
        username,
        user_type: userType,
        license_type: licenseType,
        license_level: licenseLevel,
        region,
        intro,
        contact,
        instructor_status: userType === 'instructor' ? 'pending' : null,
        license_image_url: licenseImageUrl
      });
      if (profileError) throw profileError;

      if (userType === 'instructor') {
        alert('가입 신청이 완료됐습니다!\n자격증 확인 후 강사 승인이 이루어집니다 (1~2일 소요)');
      } else {
        alert('가입이 완료됐습니다! 이메일을 확인해주세요.');
      }
      location.href = 'login.html';
    } catch (err) {
      showErr('generalErr', err.message || '오류가 발생했습니다. 다시 시도해주세요.');
      btn.textContent = '가입하기';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
