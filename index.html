<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 프리다이빙 버디 매칭</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-link:hover { color: #1D9E75; }
    .nav-btns { display: flex; gap: 8px; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-ghost:hover { border-color: #1D9E75; color: #1D9E75; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .btn-primary:hover { background: #178a65; }
    .nav-user { display: none; align-items: center; gap: 12px; }
    .nav-user span { font-size: 14px; color: #333; font-weight: 500; }
    .hero { background: linear-gradient(135deg, #e8f8f2 0%, #f0faf6 100%); padding: 64px 24px; text-align: center; }
    .hero h1 { font-size: 32px; font-weight: 700; color: #111; margin-bottom: 12px; line-height: 1.4; }
    .hero h1 span { color: #1D9E75; }
    .hero p { font-size: 16px; color: #555; margin-bottom: 32px; line-height: 1.7; }
    .hero-search { display: flex; gap: 10px; max-width: 480px; margin: 0 auto; }
    .hero-search select { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 14px; color: #333; }
    .hero-search button { padding: 12px 24px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .ad-banner { margin: 20px auto; max-width: 960px; padding: 0 24px; }
    .ad-box { height: 80px; background: #f1f3f5; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ad-label { font-size: 11px; color: #999; }
    .ad-badge { font-size: 11px; color: #854F0B; background: #FAEEDA; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
    .section { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 700; color: #111; }
    .section-more { font-size: 13px; color: #1D9E75; font-weight: 500; cursor: pointer; }
    .pool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 768px) { .pool-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .pool-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 24px; } .hero-search { flex-direction: column; } .nav-links { display: none; } }
    .pool-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; overflow: hidden; cursor: pointer; transition: box-shadow 0.2s; }
    .pool-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .pool-img { height: 80px; background: linear-gradient(135deg, #e8f8f2, #c8eee0); display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .pool-info { padding: 14px; }
    .pool-name { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 4px; }
    .pool-meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    .pool-badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #e8f8f2; color: #0F6E56; font-weight: 500; }
    .buddy-list { display: flex; flex-direction: column; gap: 10px; }
    .buddy-item { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: box-shadow 0.2s; }
    .buddy-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .buddy-left { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .buddy-name { font-size: 14px; font-weight: 600; color: #111; }
    .buddy-detail { font-size: 12px; color: #888; margin-top: 2px; }
    .buddy-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .level-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #EEEDFE; color: #3C3489; font-weight: 500; }
    .time-text { font-size: 11px; color: #bbb; }
    .lesson-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (max-width: 600px) { .lesson-list { grid-template-columns: 1fr; } }
    .lesson-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 16px; cursor: pointer; transition: box-shadow 0.2s; }
    .lesson-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .lesson-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .instructor-info { display: flex; align-items: center; gap: 8px; }
    .instructor-name { font-size: 14px; font-weight: 600; color: #111; }
    .instructor-cert { font-size: 11px; color: #888; }
    .lesson-level { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #fff3e0; color: #e65100; font-weight: 500; }
    .lesson-info { font-size: 13px; color: #555; line-height: 1.8; }
    .lesson-price { font-size: 14px; font-weight: 700; color: #1D9E75; margin-top: 8px; }
    .divider { max-width: 960px; margin: 0 auto; height: 1px; background: #e9ecef; }
    footer { background: #fff; border-top: 1px solid #e9ecef; padding: 24px; text-align: center; margin-top: 48px; }
    .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 12px; }
    .footer-link { font-size: 13px; color: #888; }
    .footer-copy { font-size: 12px; color: #bbb; }
    .loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }
    .empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div class="nav-user" id="navUser">
    <span id="navUsername"></span>
    <button class="btn-ghost" id="logoutBtn">로그아웃</button>
  </div>
</nav>

<div class="hero">
  <h1>프리다이빙 <span>버디</span>를<br>찾아보세요</h1>
  <p>전국 풀장에서 같은 시간, 같은 레벨의 버디를 매칭해드립니다</p>
  <div class="hero-search">
    <select id="regionSelect">
      <option value="">전체 지역</option>
      <option value="서울">서울</option>
      <option value="경기">경기</option>
      <option value="인천">인천</option>
      <option value="강원">강원</option>
      <option value="충청">충청</option>
      <option value="대전">대전</option>
      <option value="세종">세종</option>
      <option value="전라">전라</option>
      <option value="광주">광주</option>
      <option value="경상">경상</option>
      <option value="부산">부산</option>
      <option value="대구">대구</option>
      <option value="울산">울산</option>
      <option value="제주">제주</option>
    </select>
    <button id="searchBtn">풀장 찾기</button>
  </div>
</div>

<div class="ad-banner">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense 배너 영역</span>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <span class="section-title">인기 풀장</span>
    <a href="pools.html" class="section-more">전체 보기 →</a>
  </div>
  <div class="pool-grid" id="poolGrid">
    <div class="loading">풀장 정보를 불러오는 중...</div>
  </div>
</div>

<div class="divider"></div>

<div class="section">
  <div class="section-header">
    <span class="section-title">최근 버디 모집</span>
    <a href="buddy.html" class="section-more">더 보기 →</a>
  </div>
  <div class="buddy-list" id="buddyList">
    <div class="loading">버디 모집 현황을 불러오는 중...</div>
  </div>
</div>

<div class="ad-banner">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense 콘텐츠 하단</span>
  </div>
</div>

<div class="divider"></div>

<div class="section">
  <div class="section-header">
    <span class="section-title">강습 찾기</span>
    <a href="lessons.html" class="section-more">더 보기 →</a>
  </div>
  <div class="lesson-list" id="lessonList">
    <div class="loading">강습 정보를 불러오는 중...</div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="#" class="footer-link">이용약관</a>
    <a href="#" class="footer-link">개인정보처리방침</a>
    <a href="#" class="footer-link">문의하기</a>
  </div>
  <div class="footer-copy">© 2025 FreeBuddy. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb;

  function initSB() {
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      sb = window.supabase.createClient(SB_URL, SB_KEY);
      checkAuth();
      loadPools();
      loadBuddyPosts();
      loadLessons();
    } else {
      setTimeout(initSB, 100);
    }
  }

  async function checkAuth() {
    var res = await sb.auth.getUser();
    if (res.data && res.data.user) {
      var profile = await sb.from('profiles').select('username').eq('id', res.data.user.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = ((profile.data && profile.data.username) || '') + '님';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async function() {
    await sb.auth.signOut();
    location.reload();
  });

  document.getElementById('searchBtn').addEventListener('click', function() {
    var region = document.getElementById('regionSelect').value;
    location.href = 'pools.html' + (region ? '?region=' + region : '');
  });

  async function loadPools() {
    var res = await sb.from('pools').select('*').limit(6);
    var grid = document.getElementById('poolGrid');
    if (!res.data || res.data.length === 0) { grid.innerHTML = '<div class="empty">등록된 풀장이 없습니다</div>'; return; }
    grid.innerHTML = res.data.map(function(p) {
      return '<div class="pool-card" onclick="location.href=\'pool-detail.html?id=' + p.id + '\'">' +
        '<div class="pool-img">🏊</div>' +
        '<div class="pool-info">' +
          '<div class="pool-name">' + p.name + '</div>' +
          '<div class="pool-meta">' + p.region + (p.address ? ' · ' + p.address : '') + '</div>' +
          '<span class="pool-badge">버디 모집 중</span>' +
        '</div></div>';
    }).join('');
  }

  async function loadBuddyPosts() {
    var res = await sb.from('buddy_posts').select('*, profiles(username, license_type, license_level), pools(name, region)').order('created_at', { ascending: false }).limit(5);
    var list = document.getElementById('buddyList');
    if (!res.data || res.data.length === 0) { list.innerHTML = '<div class="empty">아직 버디 모집글이 없습니다</div>'; return; }
    list.innerHTML = res.data.map(function(p) {
      var ago = timeAgo(p.created_at);
      var username = (p.profiles && p.profiles.username) || '?';
      var poolName = (p.pools && p.pools.name) || '';
      var poolRegion = (p.pools && p.pools.region) || '';
      var lt = (p.profiles && p.profiles.license_type) || '';
      var ll = (p.profiles && p.profiles.license_level) || '';
      return '<div class="buddy-item" onclick="location.href=\'pool-detail.html?id=' + p.pool_id + '\'">' +
        '<div class="buddy-left"><div class="avatar">' + username[0] + '</div>' +
        '<div><div class="buddy-name">' + poolName + ' · ' + poolRegion + '</div>' +
        '<div class="buddy-detail">' + p.date + ' ' + p.time_slot + '</div></div></div>' +
        '<div class="buddy-right"><span class="level-badge">' + lt + ' ' + ll + '</span>' +
        '<span class="time-text">' + ago + '</span></div></div>';
    }).join('');
  }

  async function loadLessons() {
    var res = await sb.from('lessons').select('*, profiles(username, license_type, license_level), pools(name, region)').order('date', { ascending: true }).limit(4);
    var list = document.getElementById('lessonList');
    if (!res.data || res.data.length === 0) { list.innerHTML = '<div class="empty">등록된 강습이 없습니다</div>'; return; }
    list.innerHTML = res.data.map(function(l) {
      var username = (l.profiles && l.profiles.username) || '?';
      var lt = (l.profiles && l.profiles.license_type) || '';
      var ll = (l.profiles && l.profiles.license_level) || '';
      var poolName = (l.pools && l.pools.name) || '';
      var poolRegion = (l.pools && l.pools.region) || '';
      return '<div class="lesson-card" onclick="location.href=\'lesson-detail.html?id=' + l.id + '\'">' +
        '<div class="lesson-top"><div class="instructor-info"><div class="avatar">' + username[0] + '</div>' +
        '<div><div class="instructor-name">' + username + ' 강사</div>' +
        '<div class="instructor-cert">' + lt + ' ' + ll + '</div></div></div>' +
        '<span class="lesson-level">' + (l.level || '') + '</span></div>' +
        '<div class="lesson-info"><div>📍 ' + poolName + ' · ' + poolRegion + '</div>' +
        '<div>📅 ' + l.date + ' ⏰ ' + l.time_slot + '</div>' +
        '<div>👥 최대 ' + l.max_students + '명</div></div>' +
        '<div class="lesson-price">' + (l.price || '가격 협의') + '</div></div>';
    }).join('');
  }

  function timeAgo(dateStr) {
    var diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
    if (diff < 60) return diff + '분 전';
    if (diff < 1440) return Math.floor(diff / 60) + '시간 전';
    return Math.floor(diff / 1440) + '일 전';
  }

  initSB();
})();
</script>
</body>
</html>
