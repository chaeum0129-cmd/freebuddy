<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 강습 찾기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-link:hover { color: #1D9E75; }
    .nav-btns { display: flex; gap: 8px; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .nav-user { display: none; align-items: center; gap: 12px; }
    .nav-user span { font-size: 14px; color: #333; font-weight: 500; }
    .page-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 16px; }
    .filter-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 16px; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-size: 13px; color: #555; cursor: pointer; font-weight: 500; }
    .filter-btn.active { border-color: #1D9E75; background: #e8f8f2; color: #1D9E75; }
    .ad-banner { margin: 16px auto; max-width: 960px; padding: 0 24px; }
    .ad-box { height: 72px; background: #f1f3f5; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ad-label { font-size: 11px; color: #999; }
    .ad-badge { font-size: 11px; color: #854F0B; background: #FAEEDA; padding: 2px 8px; border-radius: 4px; }
    .section { max-width: 960px; margin: 0 auto; padding: 24px; }
    .lesson-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 640px) { .lesson-grid { grid-template-columns: 1fr; } .nav-links { display: none; } }
    .lesson-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 18px; cursor: pointer; transition: box-shadow 0.2s; }
    .lesson-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .lesson-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .instructor-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .instructor-name { font-size: 14px; font-weight: 600; color: #111; }
    .instructor-cert { font-size: 11px; color: #888; }
    .level-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .level-입문 { background: #e8f8f2; color: #0F6E56; }
    .level-초급 { background: #fff3e0; color: #e65100; }
    .level-중급 { background: #EEEDFE; color: #3C3489; }
    .lesson-info { font-size: 13px; color: #555; line-height: 1.9; }
    .lesson-price { font-size: 15px; font-weight: 700; color: #1D9E75; margin-top: 10px; }
    .lesson-note { font-size: 12px; color: #999; margin-top: 6px; }
    .loading { text-align: center; padding: 60px; color: #999; font-size: 14px; }
    .empty { text-align: center; padding: 60px; color: #bbb; font-size: 14px; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link" style="color:#1D9E75">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div class="nav-user" id="navUser">
    <span id="navUsername"></span>
    <button class="btn-ghost" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="page-header">
  <h1>강습 찾기</h1>
  <div class="filter-row">
    <button class="filter-btn active" onclick="filterLevel('')">전체</button>
    <button class="filter-btn" onclick="filterLevel('입문')">입문</button>
    <button class="filter-btn" onclick="filterLevel('초급')">초급</button>
    <button class="filter-btn" onclick="filterLevel('중급')">중급</button>
  </div>
</div>

<div class="ad-banner">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense 배너</span>
  </div>
</div>

<div class="section">
  <div class="lesson-grid" id="lessonGrid">
    <div class="loading">강습 목록을 불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.sb.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  let currentLevel = '';

  async function checkAuth() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      const { data: profile } = await sb.from('profiles').select('username').eq('id', user.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = (profile?.username || '') + '님';
    }
  }

  async function logout() { await sb.auth.signOut(); location.reload(); }

  function filterLevel(level) {
    currentLevel = level;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === (level || '전체'));
    });
    loadLessons();
  }

  async function loadLessons() {
    const grid = document.getElementById('lessonGrid');
    grid.innerHTML = '<div class="loading">불러오는 중...</div>';
    let query = sb.from('lessons').select('*, profiles(username, license_type, license_level), pools(name, region)').order('date', { ascending: true });
    if (currentLevel) query = query.eq('level', currentLevel);
    const { data: lessons } = await query;
    if (!lessons || lessons.length === 0) {
      grid.innerHTML = '<div class="empty">등록된 강습이 없습니다</div>';
      return;
    }
    grid.innerHTML = lessons.map(l => `
      <div class="lesson-card" onclick="location.href='lesson-detail.html?id=${l.id}'">
        <div class="lesson-top">
          <div class="instructor-info">
            <div class="avatar">${(l.profiles?.username || '?')[0]}</div>
            <div>
              <div class="instructor-name">${l.profiles?.username || ''} 강사</div>
              <div class="instructor-cert">${l.profiles?.license_type || ''} ${l.profiles?.license_level || ''}</div>
            </div>
          </div>
          <span class="level-badge level-${l.level || '입문'}">${l.level || ''}</span>
        </div>
        <div class="lesson-info">
          <div>📍 ${l.pools?.name || ''} · ${l.pools?.region || ''}</div>
          <div>📅 ${l.date} &nbsp; ⏰ ${l.time_slot}</div>
          <div>👥 최대 ${l.max_students}명</div>
        </div>
        ${l.note ? `<div class="lesson-note">📝 ${l.note}</div>` : ''}
        <div class="lesson-price">${l.price || '가격 협의'}</div>
      </div>
    `).join('');
  }

  checkAuth();
  loadLessons();

})();
</script>
</body>
</html>
