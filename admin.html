<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 관리자</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    nav { background: #111; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 18px; font-weight: 700; color: #1D9E75; }
    .admin-badge { font-size: 12px; color: #fff; background: #444; padding: 3px 10px; border-radius: 20px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
    .section { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 28px; margin-bottom: 24px; }
    h2 { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 20px; }
    .instructor-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f1f3f5; }
    .instructor-item:last-child { border: none; }
    .instructor-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0F6E56; }
    .instructor-name { font-size: 14px; font-weight: 600; color: #111; }
    .instructor-detail { font-size: 12px; color: #888; margin-top: 2px; }
    .btn-approve { padding: 7px 16px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 6px; }
    .btn-reject { padding: 7px 16px; background: #fff; color: #e53935; border: 1px solid #ffcdd2; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-view-license { padding: 5px 12px; background: #f1f3f5; color: #555; border: 1px solid #e9ecef; border-radius: 6px; font-size: 12px; cursor: pointer; margin-right: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #222; background: #fff; }
    textarea { resize: vertical; min-height: 60px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1D9E75; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { font-size: 11px; color: #aaa; margin-top: 4px; }
    .btn-submit { padding: 12px 28px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-submit:hover { background: #178a65; }
    .pool-item { padding: 16px 0; border-bottom: 1px solid #f1f3f5; }
    .pool-item:last-child { border: none; }
    .pool-item-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .pool-item-info { font-size: 14px; color: #333; font-weight: 600; }
    .pool-item-hours { font-size: 12px; color: #888; margin-top: 4px; line-height: 1.6; }
    .pool-item-btns { display: flex; gap: 6px; flex-shrink: 0; margin-left: 12px; }
    .btn-edit { padding: 5px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #555; font-size: 12px; cursor: pointer; }
    .btn-edit:hover { border-color: #1D9E75; color: #1D9E75; }
    .btn-del { padding: 5px 12px; border: 1px solid #ffcdd2; border-radius: 6px; background: #fff; color: #e53935; font-size: 12px; cursor: pointer; }
    .pool-edit-form { background: #f8f9fa; border-radius: 10px; padding: 16px; margin-top: 12px; display: none; }
    .pool-edit-form.show { display: block; }
    .btn-save { padding: 8px 20px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 6px; }
    .btn-cancel-edit { padding: 8px 20px; background: #fff; color: #555; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .empty { text-align: center; padding: 24px; color: #bbb; font-size: 13px; }
    .loading { text-align: center; padding: 24px; color: #999; font-size: 13px; }
    .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; }
    .status-pending { background: #fff3e0; color: #e65100; }
    .status-approved { background: #e8f8f2; color: #0F6E56; }
    .status-rejected { background: #ffebee; color: #e53935; }
  </style>
</head>
<body>
<nav>
  <div class="logo">FreeBuddy</div>
  <span class="admin-badge">관리자</span>
</nav>
<div class="wrap">
  <div class="section">
    <h2>강사 승인 관리</h2>
    <div id="instructorList"><div class="loading">불러오는 중...</div></div>
  </div>
  <div class="section">
    <h2>회원 목록</h2>
    <div style="margin-bottom:14px;display:flex;gap:10px">
      <input type="text" id="memberSearch" placeholder="별명 또는 이름으로 검색" style="flex:1;padding:9px 14px;border:1px solid #ddd;border-radius:8px;font-size:13px">
      <select id="memberFilter" style="padding:9px 14px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff">
        <option value="">전체</option>
        <option value="member">일반 회원</option>
        <option value="instructor">강사</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="background:#f8f9fa;border-bottom:2px solid #e9ecef">
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">별명</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">이름</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">전화번호</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">자격증</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">지역</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">유형</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">가입일</th>
            <th style="padding:10px 12px;text-align:left;color:#555;font-weight:600">관리</th>
          </tr>
        </thead>
        <tbody id="memberList"><tr><td colspan="8" style="text-align:center;padding:30px;color:#999">불러오는 중...</td></tr></tbody>
      </table>
    </div>
    <div id="memberCount" style="font-size:12px;color:#888;margin-top:10px"></div>
  </div>

  <div class="section">
    <h2>풀장 등록</h2>
    <div class="row">
      <div class="form-group">
        <label>풀장 이름</label>
        <input type="text" id="poolName" placeholder="예: 블루오션 다이빙">
      </div>
      <div class="form-group">
        <label>지역</label>
        <select id="poolRegion">
          <option value="서울">서울</option>
          <option value="경기">경기</option>
          <option value="부산">부산</option>
          <option value="제주">제주</option>
          <option value="인천">인천</option>
          <option value="대구">대구</option>
          <option value="광주">광주</option>
          <option value="대전">대전</option>
          <option value="기타">기타</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>주소</label>
      <input type="text" id="poolAddress" placeholder="예: 서울 강남구 논현동 123">
    </div>
    <div class="form-group">
      <label>수심</label>
      <input type="text" id="poolDepth" placeholder="예: 25m / 33m">
    </div>
    <div class="form-group">
      <label>평일 운영시간 및 타임</label>
      <textarea id="weekdayHours" placeholder="예: 1타임 09:00~11:00 / 2타임 11:00~13:00 / 3타임 14:00~16:00"></textarea>
      <div class="hint">타임이 있는 경우 타임별로, 자유이용은 운영시간만 입력</div>
    </div>
    <div class="form-group">
      <label>주말 운영시간 및 타임</label>
      <textarea id="weekendHours" placeholder="예: 1타임 09:00~11:00 / 2타임 11:00~13:00"></textarea>
      <div class="hint">평일과 동일하면 '평일과 동일' 입력</div>
    </div>
    <button class="btn-submit" onclick="addPool()">풀장 등록</button>
  </div>
  <div class="section">
    <h2>등록된 풀장</h2>
    <div id="poolList"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb;

  function initSB() {
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      sb = window.supabase.createClient(SB_URL, SB_KEY);
      loadMembers();
      loadInstructors();
      loadPools();
    } else {
      setTimeout(initSB, 100);
    }
  }

  window.addPool = async function() {
    var name = document.getElementById('poolName').value.trim();
    var region = document.getElementById('poolRegion').value;
    var address = document.getElementById('poolAddress').value.trim();
    var depth = document.getElementById('poolDepth').value.trim();
    var weekdayHours = document.getElementById('weekdayHours').value.trim();
    var weekendHours = document.getElementById('weekendHours').value.trim();
    if (!name) { alert('풀장 이름을 입력해주세요'); return; }
    var res = await sb.from('pools').insert({ name: name, region: region, address: address, depth: depth, weekday_hours: weekdayHours, weekend_hours: weekendHours });
    if (res.error) { alert('등록 오류: ' + res.error.message); return; }
    alert('풀장이 등록됐습니다!');
    document.getElementById('poolName').value = '';
    document.getElementById('poolAddress').value = '';
    document.getElementById('poolDepth').value = '';
    document.getElementById('weekdayHours').value = '';
    document.getElementById('weekendHours').value = '';
    loadPools();
  };

  window.toggleEdit = function(id) {
    var form = document.getElementById('editForm_' + id);
    form.classList.toggle('show');
  };

  window.savePool = async function(id) {
    var name = document.getElementById('eName_' + id).value.trim();
    var region = document.getElementById('eRegion_' + id).value;
    var address = document.getElementById('eAddress_' + id).value.trim();
    var depth = document.getElementById('eDepth_' + id).value.trim();
    var weekday = document.getElementById('eWeekday_' + id).value.trim();
    var weekend = document.getElementById('eWeekend_' + id).value.trim();
    if (!name) { alert('풀장 이름을 입력해주세요'); return; }
    var res = await sb.from('pools').update({ name: name, region: region, address: address, depth: depth, weekday_hours: weekday, weekend_hours: weekend }).eq('id', id);
    if (res.error) { alert('수정 오류: ' + res.error.message); return; }
    alert('수정됐습니다!');
    loadPools();
  };

  window.deletePool = async function(id) {
    if (!confirm('풀장을 삭제할까요?')) return;
    await sb.from('pools').delete().eq('id', id);
    loadPools();
  };

  window.updateStatus = async function(userId, status) {
    if (!confirm(status === 'approved' ? '승인하시겠습니까?' : '거절하시겠습니까?')) return;
    await sb.from('profiles').update({ instructor_status: status }).eq('id', userId);
    loadInstructors();
  };

  window.viewLicense = async function(path) {
    var res = await sb.storage.from('licenses').createSignedUrl(path, 60);
    if (res.data && res.data.signedUrl) window.open(res.data.signedUrl, '_blank');
    else alert('자격증 이미지를 불러올 수 없습니다');
  };

  var allMembers = [];

  async function loadMembers() {
    var res = await sb.from('profiles').select('*').order('created_at', { ascending: false });
    allMembers = res.data || [];
    renderMembers(allMembers);
    document.getElementById('memberCount').textContent = '전체 ' + allMembers.length + '명';
  }

  function renderMembers(members) {
    var tbody = document.getElementById('memberList');
    if (!members || members.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:#bbb">회원이 없습니다</td></tr>';
      return;
    }
    tbody.innerHTML = members.map(function(m) {
      var typeLabel = m.user_type === 'instructor'
        ? '<span style="background:#EEEDFE;color:#3C3489;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600">강사</span>'
        : '<span style="background:#e8f8f2;color:#0F6E56;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600">일반</span>';
      var statusLabel = m.instructor_status === 'pending'
        ? '<span style="background:#fff3e0;color:#e65100;padding:2px 8px;border-radius:12px;font-size:11px">승인대기</span>'
        : m.instructor_status === 'approved'
        ? '<span style="background:#e8f8f2;color:#0F6E56;padding:2px 8px;border-radius:12px;font-size:11px">승인완료</span>'
        : '';
      var date = m.created_at ? m.created_at.slice(0,10) : '';
      return '<tr style="border-bottom:1px solid #f1f3f5">' +
        '<td style="padding:10px 12px;font-weight:600">' + (m.username||'-') + '</td>' +
        '<td style="padding:10px 12px">' + (m.realname||'-') + '</td>' +
        '<td style="padding:10px 12px">' + (m.phone||'-') + '</td>' +
        '<td style="padding:10px 12px">' + (m.license_type||'-') + ' ' + (m.license_level||'') + '</td>' +
        '<td style="padding:10px 12px">' + (m.region||'-') + '</td>' +
        '<td style="padding:10px 12px">' + typeLabel + ' ' + statusLabel + '</td>' +
        '<td style="padding:10px 12px;color:#888">' + date + '</td>' +
        '<td style="padding:10px 12px"><button onclick="deleteMember('' + m.id + '')" style="padding:4px 10px;border:1px solid #ffcdd2;border-radius:6px;background:#fff;color:#e53935;font-size:11px;cursor:pointer">탈퇴</button></td>' +
        '</tr>';
    }).join('');
  }

  window.deleteMember = async function(id) {
    if (!confirm('이 회원을 탈퇴 처리할까요?')) return;
    await sb.from('profiles').delete().eq('id', id);
    loadMembers();
  };

  async function loadInstructors() {
    var res = await sb.from('profiles').select('*').eq('user_type', 'instructor').order('created_at', { ascending: false });
    var el = document.getElementById('instructorList');
    if (!res.data || res.data.length === 0) { el.innerHTML = '<div class="empty">신청한 강사가 없습니다</div>'; return; }
    el.innerHTML = res.data.map(function(p) {
      return '<div class="instructor-item"><div class="instructor-info"><div class="avatar">' + (p.username||'?')[0] + '</div><div><div class="instructor-name">' + p.username + ' <span class="status-badge status-' + p.instructor_status + '">' + (p.instructor_status==='pending'?'승인 대기':p.instructor_status==='approved'?'승인 완료':'거절') + '</span></div><div class="instructor-detail">' + (p.license_type||'') + ' ' + (p.license_level||'') + ' · ' + (p.region||'') + '</div></div></div><div>' + (p.license_image_url ? '<button class="btn-view-license" onclick="viewLicense(\''+p.license_image_url+'\')">자격증 보기</button>' : '') + (p.instructor_status==='pending' ? '<button class="btn-approve" onclick="updateStatus(\''+p.id+'\',\'approved\')">승인</button><button class="btn-reject" onclick="updateStatus(\''+p.id+'\',\'rejected\')">거절</button>' : '') + '</div></div>';
    }).join('');
  }

  var REGIONS = ['서울','경기','부산','제주','인천','대구','광주','대전','기타'];

  async function loadPools() {
    var res = await sb.from('pools').select('*').order('region');
    var el = document.getElementById('poolList');
    if (!res.data || res.data.length === 0) { el.innerHTML = '<div class="empty">등록된 풀장이 없습니다</div>'; return; }
    el.innerHTML = res.data.map(function(p) {
      var regionOpts = REGIONS.map(function(r) {
        return '<option value="' + r + '"' + (p.region === r ? ' selected' : '') + '>' + r + '</option>';
      }).join('');
      return '<div class="pool-item">' +
        '<div class="pool-item-top">' +
          '<div>' +
            '<div class="pool-item-info">' + p.name + ' · ' + p.region + (p.depth ? ' · ' + p.depth : '') + '</div>' +
            '<div class="pool-item-hours">' +
              (p.address ? '📍 ' + p.address + '<br>' : '') +
              (p.weekday_hours ? '평일: ' + p.weekday_hours + '<br>' : '') +
              (p.weekend_hours ? '주말: ' + p.weekend_hours : '') +
            '</div>' +
          '</div>' +
          '<div class="pool-item-btns">' +
            '<button class="btn-edit" onclick="toggleEdit(' + p.id + ')">수정</button>' +
            '<button class="btn-del" onclick="deletePool(' + p.id + ')">삭제</button>' +
          '</div>' +
        '</div>' +
        '<div class="pool-edit-form" id="editForm_' + p.id + '">' +
          '<div class="row" style="margin-bottom:10px">' +
            '<div><label style="font-size:12px;margin-bottom:4px;display:block">풀장 이름</label><input id="eName_' + p.id + '" value="' + (p.name||'') + '"></div>' +
            '<div><label style="font-size:12px;margin-bottom:4px;display:block">지역</label><select id="eRegion_' + p.id + '">' + regionOpts + '</select></div>' +
          '</div>' +
          '<div style="margin-bottom:10px"><label style="font-size:12px;margin-bottom:4px;display:block">주소</label><input id="eAddress_' + p.id + '" value="' + (p.address||'') + '"></div>' +
          '<div style="margin-bottom:10px"><label style="font-size:12px;margin-bottom:4px;display:block">수심</label><input id="eDepth_' + p.id + '" value="' + (p.depth||'') + '"></div>' +
          '<div style="margin-bottom:10px"><label style="font-size:12px;margin-bottom:4px;display:block">평일 운영시간</label><textarea id="eWeekday_' + p.id + '">' + (p.weekday_hours||'') + '</textarea></div>' +
          '<div style="margin-bottom:12px"><label style="font-size:12px;margin-bottom:4px;display:block">주말 운영시간</label><textarea id="eWeekend_' + p.id + '">' + (p.weekend_hours||'') + '</textarea></div>' +
          '<button class="btn-save" onclick="savePool(' + p.id + ')">저장</button>' +
          '<button class="btn-cancel-edit" onclick="toggleEdit(' + p.id + ')">취소</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // 회원 검색/필터
  document.getElementById('memberSearch').addEventListener('input', filterMembers);
  document.getElementById('memberFilter').addEventListener('change', filterMembers);

  function filterMembers() {
    var keyword = document.getElementById('memberSearch').value.toLowerCase();
    var type = document.getElementById('memberFilter').value;
    var filtered = allMembers.filter(function(m) {
      var matchKeyword = !keyword ||
        (m.username && m.username.toLowerCase().includes(keyword)) ||
        (m.realname && m.realname.toLowerCase().includes(keyword));
      var matchType = !type || m.user_type === type;
      return matchKeyword && matchType;
    });
    renderMembers(filtered);
    document.getElementById('memberCount').textContent = '검색 결과 ' + filtered.length + '명 / 전체 ' + allMembers.length + '명';
  }

  initSB();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
