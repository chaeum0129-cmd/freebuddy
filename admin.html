<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 관리자</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    nav { background: #111; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 18px; font-weight: 700; color: #1D9E75; }
    .admin-badge { font-size: 12px; color: #fff; background: #444; padding: 3px 10px; border-radius: 20px; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
    .section { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 28px; margin-bottom: 24px; }
    h2 { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 20px; }
    .instructor-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f1f3f5; }
    .instructor-item:last-child { border: none; }
    .instructor-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #0F6E56; }
    .instructor-name { font-size: 14px; font-weight: 600; color: #111; }
    .instructor-detail { font-size: 12px; color: #888; margin-top: 2px; }
    .btn-approve { padding: 7px 16px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 6px; }
    .btn-reject { padding: 7px 16px; background: #fff; color: #e53935; border: 1px solid #ffcdd2; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-view-license { padding: 5px 12px; background: #f1f3f5; color: #555; border: 1px solid #e9ecef; border-radius: 6px; font-size: 12px; cursor: pointer; margin-right: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #222; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-submit { padding: 12px 28px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-submit:hover { background: #178a65; }
    .pool-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f3f5; font-size: 14px; color: #333; }
    .pool-item:last-child { border: none; }
    .btn-del { padding: 5px 12px; border: 1px solid #ffcdd2; border-radius: 6px; background: #fff; color: #e53935; font-size: 12px; cursor: pointer; }
    .empty { text-align: center; padding: 24px; color: #bbb; font-size: 13px; }
    .loading { text-align: center; padding: 24px; color: #999; font-size: 13px; }
    .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; }
    .status-pending { background: #fff3e0; color: #e65100; }
    .status-approved { background: #e8f8f2; color: #0F6E56; }
  </style>
</head>
<body>
<nav>
  <div class="logo">FreeBuddy</div>
  <span class="admin-badge">관리자</span>
</nav>

<div class="wrap">
  <!-- 강사 승인 -->
  <div class="section">
    <h2>강사 승인 관리</h2>
    <div id="instructorList"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 풀장 등록 -->
  <div class="section">
    <h2>풀장 등록</h2>
    <div class="row">
      <div class="form-group">
        <label>풀장 이름</label>
        <input type="text" id="poolName" placeholder="블루오션 다이빙">
      </div>
      <div class="form-group">
        <label>지역</label>
        <select id="poolRegion">
          <option value="서울">서울</option>
          <option value="경기">경기</option>
          <option value="부산">부산</option>
          <option value="제주">제주</option>
          <option value="인천">인천</option>
          <option value="대구">대구</option>
          <option value="광주">광주</option>
          <option value="대전">대전</option>
          <option value="기타">기타</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>주소</label>
      <input type="text" id="poolAddress" placeholder="서울 강남구 논현동">
    </div>
    <div class="row">
      <div class="form-group">
        <label>수심</label>
        <input type="text" id="poolDepth" placeholder="25m / 33m">
      </div>
      <div class="form-group">
        <label>운영 시간</label>
        <input type="text" id="poolHours" placeholder="09:00 ~ 21:00">
      </div>
    </div>
    <button class="btn-submit" onclick="addPool()">풀장 등록</button>
  </div>

  <!-- 등록된 풀장 목록 -->
  <div class="section">
    <h2>등록된 풀장</h2>
    <div id="poolList"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadInstructors() {
    const { data } = await supabase.from('profiles').select('*').eq('user_type', 'instructor').order('created_at', { ascending: false });
    const el = document.getElementById('instructorList');
    if (!data || data.length === 0) { el.innerHTML = '<div class="empty">신청한 강사가 없습니다</div>'; return; }
    el.innerHTML = data.map(p => `
      <div class="instructor-item">
        <div class="instructor-info">
          <div class="avatar">${(p.username || '?')[0]}</div>
          <div>
            <div class="instructor-name">${p.username} <span class="status-badge status-${p.instructor_status}">${p.instructor_status === 'pending' ? '승인 대기' : p.instructor_status === 'approved' ? '승인 완료' : '거절'}</span></div>
            <div class="instructor-detail">${p.license_type || ''} ${p.license_level || ''} · ${p.region || ''}</div>
          </div>
        </div>
        <div>
          ${p.license_image_url ? `<button class="btn-view-license" onclick="viewLicense('${p.license_image_url}')">자격증 보기</button>` : ''}
          ${p.instructor_status === 'pending' ? `
            <button class="btn-approve" onclick="updateStatus('${p.id}', 'approved')">승인</button>
            <button class="btn-reject" onclick="updateStatus('${p.id}', 'rejected')">거절</button>
          ` : ''}
        </div>
      </div>
    `).join('');
  }

  async function updateStatus(userId, status) {
    const msg = status === 'approved' ? '승인하시겠습니까?' : '거절하시겠습니까?';
    if (!confirm(msg)) return;
    await supabase.from('profiles').update({ instructor_status: status }).eq('id', userId);
    loadInstructors();
  }

  async function viewLicense(path) {
    const { data } = await supabase.storage.from('licenses').createSignedUrl(path, 60);
    if (data?.signedUrl) window.open(data.signedUrl, '_blank');
    else alert('자격증 이미지를 불러올 수 없습니다');
  }

  async function addPool() {
    const name = document.getElementById('poolName').value.trim();
    const region = document.getElementById('poolRegion').value;
    const address = document.getElementById('poolAddress').value.trim();
    const depth = document.getElementById('poolDepth').value.trim();
    const hours = document.getElementById('poolHours').value.trim();
    if (!name) { alert('풀장 이름을 입력해주세요'); return; }
    const [open, close] = hours.split('~').map(s => s.trim());
    const { error } = await supabase.from('pools').insert({ name, region, address, depth, open_time: open, close_time: close });
    if (error) { alert('등록 중 오류가 발생했습니다'); return; }
    alert('풀장이 등록됐습니다!');
    document.getElementById('poolName').value = '';
    document.getElementById('poolAddress').value = '';
    document.getElementById('poolDepth').value = '';
    document.getElementById('poolHours').value = '';
    loadPools();
  }

  async function loadPools() {
    const { data: pools } = await supabase.from('pools').select('*').order('region');
    const el = document.getElementById('poolList');
    if (!pools || pools.length === 0) { el.innerHTML = '<div class="empty">등록된 풀장이 없습니다</div>'; return; }
    el.innerHTML = pools.map(p => `
      <div class="pool-item">
        <div>
          <strong>${p.name}</strong> · ${p.region}
          <span style="color:#aaa;font-size:12px;margin-left:8px">${p.address || ''} ${p.depth || ''}</span>
        </div>
        <button class="btn-del" onclick="deletePool(${p.id})">삭제</button>
      </div>
    `).join('');
  }

  async function deletePool(id) {
    if (!confirm('풀장을 삭제할까요?')) return;
    await supabase.from('pools').delete().eq('id', id);
    loadPools();
  }

  loadInstructors();
  loadPools();
</script>
</body>
</html>
