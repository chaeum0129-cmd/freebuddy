<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 강습 상세</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-btns { display: flex; gap: 8px; align-items: center; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; }
    .nav-username { font-size: 14px; color: #333; font-weight: 500; text-decoration: none; }
    .breadcrumb { padding: 12px 24px; font-size: 13px; color: #aaa; max-width: 800px; margin: 0 auto; }
    .breadcrumb a { color: #1D9E75; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 24px; }
    .lesson-card { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 28px; margin-bottom: 20px; }
    .instructor-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f1f3f5; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .instructor-name { font-size: 17px; font-weight: 700; color: #111; }
    .instructor-cert { font-size: 13px; color: #888; margin-top: 2px; }
    .instructor-intro { font-size: 13px; color: #555; margin-top: 4px; }
    .level-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .level-입문 { background: #e8f8f2; color: #0F6E56; }
    .level-초급 { background: #fff3e0; color: #e65100; }
    .level-중급 { background: #EEEDFE; color: #3C3489; }
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 500px) { .info-grid { grid-template-columns: 1fr; } .nav-links { display: none; } }
    .info-item { background: #f8f9fa; border-radius: 10px; padding: 14px; }
    .info-label { font-size: 11px; color: #aaa; font-weight: 600; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: 600; color: #333; }
    .lesson-note { background: #f8f9fa; border-radius: 10px; padding: 14px; margin-bottom: 20px; font-size: 14px; color: #555; line-height: 1.7; }
    .price-row { display: flex; align-items: center; justify-content: space-between; }
    .price { font-size: 22px; font-weight: 700; color: #1D9E75; }
    .btn-book { padding: 14px 32px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .ad-box { height: 72px; background: #f1f3f5; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .ad-badge { font-size: 11px; color: #854F0B; background: #FAEEDA; padding: 2px 8px; border-radius: 4px; }
    .ad-label { font-size: 11px; color: #999; }
    .booking-card { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 24px; }
    .booking-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 16px; }
    .booking-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f3f5; }
    .booking-item:last-child { border: none; }
    .booking-user { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #333; }
    .booking-avatar { width: 28px; height: 28px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0F6E56; }
    .status-badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .status-pending { background: #fff3e0; color: #e65100; }
    .status-confirmed { background: #e8f8f2; color: #0F6E56; }
    .empty { text-align: center; padding: 30px; color: #bbb; font-size: 13px; }
    .loading { text-align: center; padding: 30px; color: #999; font-size: 14px; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div id="navUser" style="display:none;align-items:center;gap:12px">
    <a href="my-page.html" class="nav-username" id="navUsername"></a>
    <button class="btn-ghost" id="logoutBtn">로그아웃</button>
  </div>
</nav>

<div class="breadcrumb"><a href="lessons.html">강습 목록</a> &rsaquo; 강습 상세</div>

<div class="wrap">
  <div class="lesson-card" id="lessonCard"><div class="loading">강습 정보를 불러오는 중...</div></div>
  <div class="ad-box"><span class="ad-badge">광고</span><span class="ad-label">Google AdSense</span></div>
  <div class="booking-card">
    <div class="booking-title">예약 현황</div>
    <div id="bookingList"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>
  var sb = getSB();
  var lessonId = new URLSearchParams(window.location.search).get('id');
  var currentUser = null;
  var lessonData = null;

  async function checkAuth() {
    var res = await sb.auth.getUser();
    currentUser = res.data && res.data.user;
    if (currentUser) {
      var profile = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = ((profile.data && profile.data.username) || '') + '님';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async function() {
    await sb.auth.signOut(); location.reload();
  });

  async function loadLesson() {
    var res = await sb.from('lessons').select('*, profiles(username, license_type, license_level, intro, contact), pools(name, region, address)').eq('id', lessonId).single();
    if (!res.data) { document.getElementById('lessonCard').innerHTML = '<div class="empty">강습 정보를 찾을 수 없습니다</div>'; return; }
    lessonData = res.data;
    var l = lessonData;
    var username = (l.profiles && l.profiles.username) || '?';
    var levelClass = 'level-' + (l.level || '입문');
    document.title = 'FreeBuddy - ' + username + ' 강사 강습';
    document.getElementById('lessonCard').innerHTML =
      '<div class="instructor-row"><div class="avatar">' + username[0] + '</div>' +
      '<div style="flex:1"><div class="instructor-name">' + username + ' 강사</div>' +
      '<div class="instructor-cert">' + (l.profiles && l.profiles.license_type || '') + ' ' + (l.profiles && l.profiles.license_level || '') + '</div>' +
      (l.profiles && l.profiles.intro ? '<div class="instructor-intro">' + l.profiles.intro + '</div>' : '') + '</div>' +
      '<span class="level-badge ' + levelClass + '">' + (l.level || '') + '</span></div>' +
      '<div class="info-grid">' +
      '<div class="info-item"><div class="info-label">풀장</div><div class="info-value">📍 ' + (l.pools && l.pools.name || '') + '</div></div>' +
      '<div class="info-item"><div class="info-label">지역</div><div class="info-value">' + (l.pools && l.pools.region || '') + '</div></div>' +
      '<div class="info-item"><div class="info-label">날짜</div><div class="info-value">📅 ' + l.date + '</div></div>' +
      '<div class="info-item"><div class="info-label">시간</div><div class="info-value">⏰ ' + l.time_slot + '</div></div>' +
      '<div class="info-item"><div class="info-label">수강 인원</div><div class="info-value">👥 최대 ' + l.max_students + '명</div></div>' +
      '<div class="info-item"><div class="info-label">수준</div><div class="info-value">' + (l.level || '') + '</div></div></div>' +
      (l.note ? '<div class="lesson-note">📝 ' + l.note + '</div>' : '') +
      '<div class="price-row"><div class="price">' + (l.price || '가격 협의') + '</div>' +
      '<button class="btn-book" id="bookBtn">수강 신청</button></div>';

    document.getElementById('bookBtn').addEventListener('click', bookLesson);
    loadBookings();
  }

  async function loadBookings() {
    var res = await sb.from('lesson_bookings').select('*, profiles(username)').eq('lesson_id', lessonId);
    var list = document.getElementById('bookingList');
    if (!res.data || !res.data.length) { list.innerHTML = '<div class="empty">아직 예약자가 없습니다</div>'; return; }
    list.innerHTML = res.data.map(function(b) {
      var uname = (b.profiles && b.profiles.username) || '?';
      return '<div class="booking-item"><div class="booking-user"><div class="booking-avatar">' + uname[0] + '</div>' + uname + '</div>' +
        '<span class="status-badge status-' + b.status + '">' + (b.status === 'pending' ? '신청 중' : '확정') + '</span></div>';
    }).join('');
  }

  async function bookLesson() {
    if (!currentUser) { if (confirm('로그인이 필요합니다. 로그인 하시겠습니까?')) location.href = 'login.html'; return; }
    if (lessonData && currentUser.id === lessonData.instructor_id) { alert('본인 강습에는 신청할 수 없습니다'); return; }
    var res = await sb.from('lesson_bookings').insert({ lesson_id: lessonId, student_id: currentUser.id });
    if (res.error) { alert(res.error.message.includes('duplicate') ? '이미 신청한 강습입니다' : '오류가 발생했습니다'); return; }
    alert('수강 신청이 완료됐습니다!\n강사님께 연락하여 일정을 확정해주세요.');
    if (lessonData && lessonData.profiles && lessonData.profiles.contact) window.open(lessonData.profiles.contact, '_blank');
    loadBookings();
  }

  checkAuth();
  loadLesson();
</script>
</body>
</html>
