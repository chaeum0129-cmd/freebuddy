<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 버디 구하기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-link:hover { color: #1D9E75; }
    .nav-btns { display: flex; gap: 8px; align-items: center; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .nav-username { font-size: 14px; color: #333; font-weight: 500; text-decoration: none; }
    .nav-username:hover { color: #1D9E75; }
    .page-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: #111; }
    .ad-banner { margin: 16px auto; max-width: 960px; padding: 0 24px; }
    .ad-box { height: 72px; background: #f1f3f5; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ad-badge { font-size: 11px; color: #854F0B; background: #FAEEDA; padding: 2px 8px; border-radius: 4px; }
    .ad-label { font-size: 11px; color: #999; }
    .section { max-width: 960px; margin: 0 auto; padding: 24px; }
    .buddy-list { display: flex; flex-direction: column; gap: 12px; }
    .buddy-item { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; transition: box-shadow 0.2s; }
    .buddy-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .buddy-left { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .buddy-name { font-size: 15px; font-weight: 600; color: #111; }
    .buddy-detail { font-size: 13px; color: #888; margin-top: 3px; }
    .buddy-note { font-size: 12px; color: #aaa; margin-top: 2px; }
    .buddy-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .level-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #EEEDFE; color: #3C3489; font-weight: 500; }
    .time-text { font-size: 11px; color: #bbb; }
    .btn-contact { font-size: 12px; padding: 6px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #333; cursor: pointer; }
    .btn-contact:hover { border-color: #1D9E75; color: #1D9E75; }
    .loading { text-align: center; padding: 60px; color: #999; font-size: 14px; }
    .empty { text-align: center; padding: 60px; color: #bbb; font-size: 14px; }
    @media (max-width: 600px) { .nav-links { display: none; } .buddy-item { flex-direction: column; align-items: flex-start; gap: 10px; } .buddy-right { align-items: flex-start; flex-direction: row; } }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link" style="color:#1D9E75">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div id="navUser" style="display:none;align-items:center;gap:12px">
    <a href="my-page.html" class="nav-username" id="navUsername"></a>
    <button class="btn-ghost" id="logoutBtn">로그아웃</button>
  </div>
</nav>

<div class="page-header">
  <h1>전국 버디 모집 현황</h1>
</div>

<div class="ad-banner">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense 배너</span>
  </div>
</div>

<div class="section">
  <div class="buddy-list" id="buddyList">
    <div class="loading">버디 모집 현황을 불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sb.js"></script>
<script>
  var sb = getSB();
  var currentUser = null;

  async function checkAuth() {
    var res = await sb.auth.getUser();
    currentUser = res.data && res.data.user;
    if (currentUser) {
      var profile = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = ((profile.data && profile.data.username) || '') + '님';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async function() {
    await sb.auth.signOut(); location.reload();
  });

  function timeAgo(dateStr) {
    var diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
    if (diff < 60) return diff + '분 전';
    if (diff < 1440) return Math.floor(diff / 60) + '시간 전';
    return Math.floor(diff / 1440) + '일 전';
  }

  async function loadBuddyPosts() {
    var res = await sb.from('buddy_posts')
      .select('*, profiles(username, license_type, license_level), pools(name, region)')
      .order('created_at', { ascending: false });
    var list = document.getElementById('buddyList');
    if (!res.data || !res.data.length) { list.innerHTML = '<div class="empty">아직 버디 모집글이 없습니다</div>'; return; }
    list.innerHTML = res.data.map(function(p) {
      var username = (p.profiles && p.profiles.username) || '?';
      var poolName = (p.pools && p.pools.name) || '';
      var poolRegion = (p.pools && p.pools.region) || '';
      var lt = (p.profiles && p.profiles.license_type) || '';
      var ll = (p.profiles && p.profiles.license_level) || '';
      return '<div class="buddy-item">' +
        '<div class="buddy-left"><div class="avatar">' + username[0] + '</div>' +
        '<div><div class="buddy-name">' + poolName + ' <span style="color:#aaa;font-size:12px">· ' + poolRegion + '</span></div>' +
        '<div class="buddy-detail">📅 ' + p.date + ' &nbsp; ⏰ ' + p.time_slot + '</div>' +
        (p.note ? '<div class="buddy-note">📝 ' + p.note + '</div>' : '') + '</div></div>' +
        '<div class="buddy-right"><span class="level-badge">' + lt + ' ' + ll + '</span>' +
        '<span class="time-text">' + timeAgo(p.created_at) + '</span>' +
        '<button class="btn-contact" data-contact="' + (p.contact || '') + '" data-username="' + username + '">연락하기</button></div></div>';
    }).join('');

    list.querySelectorAll('.btn-contact').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (!currentUser) { if (confirm('로그인이 필요합니다. 로그인 하시겠습니까?')) location.href = 'login.html'; return; }
        var contact = this.dataset.contact;
        var uname = this.dataset.username;
        if (contact) window.open(contact, '_blank');
        else alert(uname + '님의 연락처 정보가 없습니다');
      });
    });
  }

  checkAuth();
  loadBuddyPosts();
</script>
</body>
</html>
