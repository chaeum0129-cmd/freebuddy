<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 풀장 찾기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-link:hover { color: #1D9E75; }
    .nav-btns { display: flex; gap: 8px; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .nav-user { display: none; align-items: center; gap: 12px; }
    .nav-user span { font-size: 14px; color: #333; font-weight: 500; }
    .page-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 16px; }
    .filter-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 16px; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-size: 13px; color: #555; cursor: pointer; font-weight: 500; }
    .filter-btn.active { border-color: #1D9E75; background: #e8f8f2; color: #1D9E75; }
    .ad-banner { margin: 20px auto; max-width: 960px; padding: 0 24px; }
    .ad-box { height: 80px; background: #f1f3f5; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ad-label { font-size: 11px; color: #999; }
    .ad-badge { font-size: 11px; color: #854F0B; background: #FAEEDA; padding: 2px 8px; border-radius: 4px; }
    .section { max-width: 960px; margin: 0 auto; padding: 24px; }
    .pool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 768px) { .pool-grid { grid-template-columns: repeat(2, 1fr); } .nav-links { display: none; } }
    @media (max-width: 480px) { .pool-grid { grid-template-columns: 1fr; } }
    .pool-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; overflow: hidden; cursor: pointer; transition: box-shadow 0.2s; }
    .pool-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .pool-img { height: 100px; background: linear-gradient(135deg, #e8f8f2, #c8eee0); display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .pool-info { padding: 14px; }
    .pool-name { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 4px; }
    .pool-region { font-size: 12px; color: #888; margin-bottom: 4px; }
    .pool-address { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .pool-detail { display: flex; gap: 8px; }
    .pool-tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #f1f3f5; color: #666; }
    .pool-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #e8f8f2; color: #0F6E56; font-weight: 500; }
    .loading { text-align: center; padding: 60px; color: #999; font-size: 14px; }
    .empty { text-align: center; padding: 60px; color: #bbb; font-size: 14px; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link" style="color:#1D9E75">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div class="nav-user" id="navUser">
    <a href="my-page.html" id="navUsername" style="font-size:14px;color:#333;font-weight:500;text-decoration:none;cursor:pointer"></a>
    <button class="btn-ghost" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="page-header">
  <h1>전국 풀장 찾기</h1>
  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" onclick="filterRegion('')">전체</button>
    <button class="filter-btn" onclick="filterRegion('서울')">서울</button>
    <button class="filter-btn" onclick="filterRegion('경기')">경기</button>
    <button class="filter-btn" onclick="filterRegion('부산')">부산</button>
    <button class="filter-btn" onclick="filterRegion('제주')">제주</button>
    <button class="filter-btn" onclick="filterRegion('인천')">인천</button>
    <button class="filter-btn" onclick="filterRegion('대구')">대구</button>
    <button class="filter-btn" onclick="filterRegion('광주')">광주</button>
    <button class="filter-btn" onclick="filterRegion('대전')">대전</button>
  </div>
</div>

<div class="ad-banner">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense 배너</span>
  </div>
</div>

<div class="section">
  <div class="pool-grid" id="poolGrid">
    <div class="loading">풀장 목록을 불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  let currentRegion = '';

  async function checkAuth() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      const { data: profile } = await sb.from('profiles').select('username').eq('id', user.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = (profile?.username || '') + '님';
    }
  }

  async function logout() { await sb.auth.signOut(); location.reload(); }

  window.filterRegion = function(region) {
    currentRegion = region;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === (region || '전체'));
    });
    loadPools();
  }

  async function loadPools() {
    const grid = document.getElementById('poolGrid');
    grid.innerHTML = '<div class="loading">불러오는 중...</div>';
    let query = sb.from('pools').select('*').order('name');
    if (currentRegion) query = query.eq('region', currentRegion);
    const { data: pools } = await query;
    if (!pools || pools.length === 0) {
      grid.innerHTML = '<div class="empty">해당 지역에 등록된 풀장이 없습니다</div>';
      return;
    }
    grid.innerHTML = pools.map(p => `
      <div class="pool-card" onclick="location.href='pool-detail.html?id=${p.id}'">
        <div class="pool-img">🏊</div>
        <div class="pool-info">
          <div class="pool-name">${p.name}</div>
          <div class="pool-region">📍 ${p.region}</div>
          <div class="pool-address">${p.address || ''}</div>
          <div class="pool-detail">
            ${p.depth ? `<span class="pool-tag">${p.depth}</span>` : ''}
            ${p.open_time ? `<span class="pool-tag">${p.open_time}~${p.close_time}</span>` : ''}
            <span class="pool-badge">버디 모집 중</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // URL 파라미터로 지역 필터
  const urlParams = new URLSearchParams(window.location.search);
  const regionParam = urlParams.get('region');
  if (regionParam) filterRegion(regionParam);

  checkAuth();
  loadPools();

})();
</script>
</body>
</html>
