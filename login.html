<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; text-decoration: none; }
    .logo span { color: #222; }
    .wrap { max-width: 400px; margin: 64px auto; padding: 0 24px; }
    .card { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 36px; }
    h2 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #222; }
    input:focus { outline: none; border-color: #1D9E75; }
    .btn-submit { width: 100%; padding: 14px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-submit:hover { background: #178a65; }
    .btn-submit:disabled { background: #aaa; cursor: default; }

    /* 구분선 */
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e9ecef; }
    .divider span { font-size: 12px; color: #bbb; white-space: nowrap; }

    /* 구글 로그인 버튼 */
    .btn-google {
      width: 100%;
      padding: 13px;
      background: #fff;
      color: #333;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .btn-google:hover { border-color: #1D9E75; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .btn-google:disabled { opacity: 0.6; cursor: default; }
    .google-icon { width: 20px; height: 20px; }

    .signup-link { text-align: center; margin-top: 16px; font-size: 13px; color: #888; }
    .signup-link a { color: #1D9E75; font-weight: 600; text-decoration: none; }
    .find-link { text-align: center; margin-top: 10px; font-size: 13px; }
    .find-link a { color: #888; text-decoration: none; }
    .find-link a:hover { color: #1D9E75; }
    .error { color: #e53935; font-size: 13px; margin-top: 10px; display: none; text-align: center; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
</nav>

<div class="wrap">
  <div class="card">
    <h2>로그인</h2>
    <p class="sub">FreeBuddy에 오신 것을 환영합니다</p>

    <!-- 구글 로그인 -->
    <button type="button" class="btn-google" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google로 로그인
    </button>

    <div class="divider"><span>또는 이메일로 로그인</span></div>

    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="email" placeholder="example@email.com">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <div class="error" id="loginErr"></div>
    <button type="button" class="btn-submit" id="loginBtn">로그인</button>

    <div class="signup-link" style="margin-top:20px">
      계정이 없으신가요? <a href="signup.html">회원가입</a>
    </div>
    <div class="find-link">
      <a href="find-account.html">별명 찾기 / 비밀번호 재설정</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  /* ── 구글 로그인 ── */
  document.getElementById('googleBtn').addEventListener('click', async function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '구글 연결 중...';
    var res = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/setup-profile.html'
      }
    });
    if (res.error) {
      document.getElementById('loginErr').textContent = '구글 로그인 실패: ' + res.error.message;
      document.getElementById('loginErr').style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Google로 로그인';
    }
  });

  /* ── 이메일 로그인 ── */
  async function doLogin() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';
    if (!email || !password) { errEl.textContent = '이메일과 비밀번호를 입력해주세요'; errEl.style.display = 'block'; return; }
    var btn = document.getElementById('loginBtn');
    btn.textContent = '로그인 중...'; btn.disabled = true;
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) {
      if (res.error.message.includes('Email not confirmed')) {
        errEl.textContent = '이메일 인증이 필요합니다.';
      } else if (res.error.message.includes('Invalid login')) {
        errEl.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
      } else {
        errEl.textContent = '로그인에 실패했습니다.';
      }
      errEl.style.display = 'block';
      btn.textContent = '로그인'; btn.disabled = false;
    } else {
      location.href = 'index.html';
    }
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
})();
</script>
</body>
</html>
