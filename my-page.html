<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 마이페이지</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px; }
    .profile-card { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 28px; margin-bottom: 20px; }
    .profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .avatar-lg { width: 64px; height: 64px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #0F6E56; flex-shrink: 0; overflow: hidden; position: relative; cursor: pointer; }
    .avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar-lg .avatar-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); border-radius: 50%; display: none; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
    .avatar-lg:hover .avatar-overlay { display: flex; }
    .profile-name { font-size: 20px; font-weight: 700; color: #111; }
    .profile-type { font-size: 13px; color: #888; margin-top: 4px; }
    .badge-approved { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #e8f8f2; color: #0F6E56; font-weight: 600; margin-left: 8px; }
    .badge-pending { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #fff3e0; color: #e65100; font-weight: 600; margin-left: 8px; }
    .profile-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 500px) { .profile-info { grid-template-columns: 1fr 1fr; } .nav-links { display: none; } }
    .info-item { background: #f8f9fa; border-radius: 10px; padding: 12px; }
    .info-label { font-size: 11px; color: #aaa; font-weight: 600; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: 600; color: #333; }
    .section-card { background: #fff; border: 1px solid #e9ecef; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .section-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 16px; }
    .post-item { padding: 12px 0; border-bottom: 1px solid #f1f3f5; display: flex; align-items: center; justify-content: space-between; }
    .post-item:last-child { border: none; }
    .post-info { font-size: 14px; color: #333; }
    .post-detail { font-size: 12px; color: #888; margin-top: 2px; }
    .btn-delete { font-size: 12px; padding: 5px 12px; border: 1px solid #ffcdd2; border-radius: 6px; background: #fff; color: #e53935; cursor: pointer; }
    .btn-delete:hover { background: #ffebee; }
    .btn-logout { width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 14px; font-weight: 600; color: #888; cursor: pointer; margin-top: 8px; }
    .btn-edit-profile { padding: 8px 16px; border: 1.5px solid #1D9E75; border-radius: 8px; background: #fff; color: #1D9E75; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; }
    .btn-edit-profile:hover { background: #e8f8f2; }
    .edit-form { margin-top: 20px; padding-top: 20px; border-top: 1px solid #f1f3f5; display: none; }
    .edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .edit-field label { display: block; font-size: 12px; font-weight: 700; color: #888; margin-bottom: 6px; }
    .edit-field input, .edit-field select { width: 100%; padding: 10px 12px; border: 1.5px solid #e0e3e7; border-radius: 8px; font-size: 14px; color: #222; font-family: inherit; outline: none; }
    .edit-field input:focus, .edit-field select:focus { border-color: #1D9E75; }
    .btn-save-profile { padding: 11px 24px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-cancel-edit { padding: 11px 20px; background: #fff; color: #888; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; margin-left: 8px; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #111; color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .btn-logout:hover { border-color: #e53935; color: #e53935; }
    .empty { text-align: center; padding: 24px; color: #bbb; font-size: 13px; }
    .loading { text-align: center; padding: 24px; color: #999; font-size: 13px; }
    .instructor-section { background: #e8f8f2; border: 1px solid #9FE1CB; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .instructor-section p { font-size: 14px; color: #0F6E56; margin-bottom: 12px; }
    .btn-add-lesson { padding: 10px 20px; background: #1D9E75; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
  </div>
  <button class="btn-ghost" onclick="logout()">로그아웃</button>
</nav>

<div class="wrap">
  <div class="profile-card" id="profileCard">
    <div class="loading">프로필을 불러오는 중...</div>
  </div>

  <div id="instructorBox" style="display:none" class="instructor-section">
    <p>✅ 승인된 강사입니다. 강습 일정을 등록할 수 있습니다.</p>
    <button class="btn-add-lesson" onclick="location.href='add-lesson.html'">강습 일정 등록</button>
  </div>

  <div class="section-card">
    <div class="section-title">내 버디 모집 현황</div>
    <div id="myBuddyPosts"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="section-card" id="myLessonsCard" style="display:none">
    <div class="section-title">내 강습 일정</div>
    <div id="myLessons"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="section-card">
    <div class="section-title">신청한 강습</div>
    <div id="myBookings"><div class="loading">불러오는 중...</div></div>
  </div>

  <button class="btn-logout" onclick="logout()">로그아웃</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb = window.supabase.createClient(SB_URL, SB_KEY, {
        auth: { persistSession: true, storageKey: 'freebuddy-auth', storage: window.localStorage }
      });

  let currentUser = null;

  async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { location.href = 'login.html'; return; }
    currentUser = user;
    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if (!profile) return;

    const isInstructor = profile.user_type === 'instructor' && profile.instructor_status === 'approved';
    const isPending = profile.user_type === 'instructor' && profile.instructor_status === 'pending';

    document.getElementById('profileCard').innerHTML = `
      <div class="profile-top">
        <div class="avatar-lg">${(profile.username || '?')[0]}</div>
        <div>
          <div class="profile-name">
            ${profile.username}
            ${isInstructor ? '<span class="badge-approved">강사 ✓</span>' : ''}
            ${isPending ? '<span class="badge-pending">승인 대기 중</span>' : ''}
          </div>
          <div class="profile-type">${profile.user_type === 'instructor' ? '강사 회원' : '일반 회원'}</div>
        </div>
      </div>
      <div class="profile-info">
        <div class="info-item"><div class="info-label">자격증</div><div class="info-value">${profile.license_type || '-'}</div></div>
        <div class="info-item"><div class="info-label">레벨</div><div class="info-value">${profile.license_level || '-'}</div></div>
        <div class="info-item"><div class="info-label">활동 지역</div><div class="info-value">${profile.region || '-'}</div></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px">
        <button class="btn-edit-profile" onclick="toggleEditForm()">✏️ 프로필 수정</button>
      </div>
      <div class="edit-form" id="editForm">
        <div class="edit-row">
          <div class="edit-field">
            <label>닉네임</label>
            <input type="text" id="editUsername" value="${profile.username || ''}">
          </div>
          <div class="edit-field">
            <label>활동 지역</label>
            <select id="editRegion">
              <option value="">선택 안함</option>
              ${['서울','경기','인천','강원','충청','대전','세종','전라','광주','경상','부산','대구','울산','제주'].map(r => `<option value="${r}" ${profile.region===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="edit-row">
          <div class="edit-field">
            <label>자격증 종류</label>
            <select id="editLicenseType" onchange="toggleLicenseOther()">
              ${['자격증없음','AIDA','SSI','PADI','CMAS','직접입력'].map(l => `<option value="${l}" ${profile.license_type===l?'selected':''}>${l==='자격증없음'?'자격증 없음':l}</option>`).join('')}
            </select>
            <input type="text" id="editLicenseOther" placeholder="자격증 이름 입력" style="margin-top:6px;display:${profile.license_type&&!['자격증없음','AIDA','SSI','PADI','CMAS'].includes(profile.license_type)?'block':'none'}" value="${profile.license_type&&!['자격증없음','AIDA','SSI','PADI','CMAS'].includes(profile.license_type)?profile.license_type:''}">
          </div>
          <div class="edit-field">
            <label>레벨</label>
            <select id="editLicenseLevel">
              <option value="">선택 안함</option>
              ${['입문','레벨2','레벨3','레벨4','오픈워터','어드밴스','레스큐','다이브마스터'].map(l => `<option value="${l}" ${profile.license_level===l?'selected':''}>${l}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="edit-field" style="margin-bottom:16px">
          <label>한줄 소개</label>
          <input type="text" id="editIntro" value="${profile.intro || ''}" placeholder="소개를 입력해주세요">
        </div>
        <div>
          <button class="btn-save-profile" onclick="saveProfile()">저장</button>
          <button class="btn-cancel-edit" onclick="toggleEditForm()">취소</button>
        </div>
      </div>
    `;

    if (isInstructor) {
      document.getElementById('instructorBox').style.display = 'block';
      document.getElementById('myLessonsCard').style.display = 'block';
      loadMyLessons(user.id);
    }

    loadMyBuddyPosts(user.id);
    loadMyBookings(user.id);
  }

  async function loadMyBuddyPosts(userId) {
    const { data: posts } = await sb.from('buddy_posts').select('*, pools(name, region)').eq('user_id', userId).order('date', { ascending: false });
    const el = document.getElementById('myBuddyPosts');
    if (!posts || posts.length === 0) { el.innerHTML = '<div class="empty">등록한 버디 모집이 없습니다</div>'; return; }
    el.innerHTML = posts.map(p => `
      <div class="post-item">
        <div>
          <div class="post-info">${p.pools?.name || ''} · ${p.date} ${p.time_slot}</div>
          <div class="post-detail">${p.note || ''}</div>
        </div>
        <button class="btn-delete" onclick="deleteBuddyPost(${p.id})">삭제</button>
      </div>
    `).join('');
  }

  window.deleteBuddyPost = async function(id) {
    if (!confirm('버디 모집 글을 삭제할까요?')) return;
    await sb.from('buddy_posts').delete().eq('id', id);
    loadMyBuddyPosts(currentUser.id);
  }

  async function loadMyLessons(userId) {
    const { data: lessons } = await sb.from('lessons').select('*, pools(name)').eq('instructor_id', userId).order('date', { ascending: false });
    const el = document.getElementById('myLessons');
    if (!lessons || lessons.length === 0) { el.innerHTML = '<div class="empty">등록한 강습이 없습니다</div>'; return; }
    el.innerHTML = lessons.map(l => `
      <div class="post-item">
        <div>
          <div class="post-info">${l.pools?.name || ''} · ${l.date} ${l.time_slot} · ${l.level || ''}</div>
          <div class="post-detail">${l.price || '가격 협의'} · 최대 ${l.max_students}명</div>
        </div>
        <button class="btn-delete" onclick="deleteLesson(${l.id})">삭제</button>
      </div>
    `).join('');
  }

  window.deleteLesson = async function(id) {
    if (!confirm('강습 일정을 삭제할까요?')) return;
    await sb.from('lessons').delete().eq('id', id);
    loadMyLessons(currentUser.id);
  }

  async function loadMyBookings(userId) {
    const { data: bookings } = await sb.from('lesson_bookings').select('*, lessons(date, time_slot, level, profiles(username)), pools(name)').eq('student_id', userId);
    const el = document.getElementById('myBookings');
    if (!bookings || bookings.length === 0) { el.innerHTML = '<div class="empty">신청한 강습이 없습니다</div>'; return; }
    el.innerHTML = bookings.map(b => `
      <div class="post-item">
        <div>
          <div class="post-info">${b.lessons?.profiles?.username || ''} 강사 · ${b.lessons?.date || ''} ${b.lessons?.time_slot || ''}</div>
          <div class="post-detail">${b.status === 'pending' ? '신청 중' : '확정'}</div>
        </div>
      </div>
    `).join('');
  }

  window.uploadAvatar = async function(event) {
    var file = event.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { showToast('이미지는 2MB 이하로 올려주세요'); return; }

    var ext = file.name.split('.').pop();
    var path = currentUser.id + '/avatar.' + ext;

    showToast('업로드 중...');

    // Supabase Storage에 업로드
    var uploadRes = await sb.storage.from('avatars').upload(path, file, { upsert: true });
    if (uploadRes.error) {
      // Storage 없으면 base64로 저장
      var reader = new FileReader();
      reader.onload = async function(e) {
        var base64 = e.target.result;
        await sb.from('profiles').update({ avatar_url: base64 }).eq('id', currentUser.id);
        showToast('✅ 프로필 사진이 저장됐습니다!');
        setTimeout(function() { location.reload(); }, 1000);
      };
      reader.readAsDataURL(file);
      return;
    }

    var urlRes = sb.storage.from('avatars').getPublicUrl(path);
    var publicUrl = urlRes.data.publicUrl;
    await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
    showToast('✅ 프로필 사진이 저장됐습니다!');
    setTimeout(function() { location.reload(); }, 1000);
  };

  window.toggleLicenseOther = function() {
    var sel = document.getElementById('editLicenseType');
    var other = document.getElementById('editLicenseOther');
    other.style.display = sel.value === '직접입력' ? 'block' : 'none';
    if (sel.value !== '직접입력') other.value = '';
  };

  window.toggleEditForm = function() {
    var form = document.getElementById('editForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  };

  window.saveProfile = async function() {
    var username = document.getElementById('editUsername').value.trim();
    if (!username) { alert('닉네임을 입력해주세요'); return; }
    var btn = document.querySelector('.btn-save-profile');
    btn.disabled = true; btn.textContent = '저장 중...';
    var res = await sb.from('profiles').update({
      username: username,
      region: document.getElementById('editRegion').value || null,
      license_type: (function() {
        var t = document.getElementById('editLicenseType').value;
        if (t === '직접입력') return document.getElementById('editLicenseOther').value.trim() || null;
        return t || null;
      })(),
      license_level: document.getElementById('editLicenseLevel').value || null,
      intro: document.getElementById('editIntro').value.trim() || null
    }).eq('id', currentUser.id);
    btn.disabled = false; btn.textContent = '저장';
    if (res.error) { alert('오류: ' + res.error.message); return; }
    showToast('✅ 프로필이 저장됐습니다!');
    setTimeout(function() { location.reload(); }, 1000);
  };

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  window.logout = async function() { await sb.auth.signOut(); location.href = 'index.html'; }

  init();

})();
</script>
<div class="toast" id="toast"></div>
</body>
</html>
