<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 커뮤니티</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }

    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px;
          display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-link:hover { color: #1D9E75; }
    .nav-btns { display: flex; gap: 8px; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-ghost:hover { border-color: #1D9E75; color: #1D9E75; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .nav-user { display: none; align-items: center; gap: 12px; }

    /* 페이지 헤더 */
    .page-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 20px 24px; }
    .page-header-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .page-title { font-size: 22px; font-weight: 700; color: #111; }
    .btn-write { display: flex; align-items: center; gap: 7px; padding: 9px 20px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-write:hover { background: #178a65; }

    /* 카테고리 필터 */
    .filter-wrap { max-width: 800px; margin: 0 auto; padding: 16px 24px 0; }
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 16px; border: 1.5px solid #e0e3e7; border-radius: 20px; background: #fff; font-size: 13px; color: #666; cursor: pointer; font-weight: 500; transition: all 0.15s; }
    .filter-btn:hover { border-color: #1D9E75; color: #1D9E75; }
    .filter-btn.active { border-color: #1D9E75; background: #1D9E75; color: #fff; font-weight: 700; }

    /* 게시판 */
    .section { max-width: 800px; margin: 0 auto; padding: 16px 24px 80px; }

    /* 공지 영역 */
    .notice-area { margin-bottom: 8px; }
    .notice-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: #fffbea; border: 1px solid #fde68a; border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: background 0.1s; }
    .notice-item:hover { background: #fef9c3; }
    .notice-badge { font-size: 11px; font-weight: 700; background: #f59e0b; color: #fff; padding: 2px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
    .notice-title { font-size: 14px; font-weight: 600; color: #333; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice-date { font-size: 12px; color: #aaa; flex-shrink: 0; }

    /* 게시글 카드 */
    .post-list { display: flex; flex-direction: column; gap: 8px; }
    .post-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
    .post-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.06); border-color: #d0f0e4; }
    .post-card.hot { border-color: #fde68a; background: #fffdf5; }
    .post-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cat-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
    .cat-자랑 { background: #FFF0F6; color: #c2185b; }
    .cat-소통 { background: #e8f8f2; color: #0F6E56; }
    .cat-질문 { background: #EEEDFE; color: #3C3489; }
    .cat-정보 { background: #e3f0ff; color: #1565C0; }
    .cat-공지 { background: #FFF3E0; color: #E65100; }
    .hot-badge { font-size: 11px; font-weight: 700; background: #FF6B35; color: #fff; padding: 3px 9px; border-radius: 6px; animation: hotPulse 2s infinite; }
    @keyframes hotPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    .post-title { font-size: 15px; font-weight: 700; color: #111; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-meta { display: flex; align-items: center; gap: 14px; }
    .post-author { font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; }
    .post-author-avatar { width: 20px; height: 20px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .post-stats { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .post-stat { font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 3px; }
    .post-stat.liked { color: #e53e3e; }
    .post-preview { font-size: 13px; color: #888; margin: 6px 0 8px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-time { font-size: 11px; color: #ccc; }

    /* 빈 상태 */
    .empty { text-align: center; padding: 60px 24px; color: #bbb; }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }
    .loading { text-align: center; padding: 60px; color: #999; font-size: 14px; }

    /* 더보기 */
    .btn-more { width: 100%; padding: 13px; background: #fff; border: 1.5px solid #e0e3e7; border-radius: 10px; font-size: 14px; color: #666; cursor: pointer; margin-top: 12px; font-weight: 500; }
    .btn-more:hover { border-color: #1D9E75; color: #1D9E75; }

    @media (max-width: 600px) { .nav-links { display: none; } .page-title { font-size: 18px; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
    <a href="community.html" class="nav-link" style="color:#1D9E75">커뮤니티</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div class="nav-user" id="navUser">
    <a href="my-page.html" id="navUsername" style="font-size:14px;color:#333;font-weight:500;text-decoration:none"></a>
    <button class="btn-ghost" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="page-title">🌊 커뮤니티</div>
    <button class="btn-write" id="writeBtn" style="display:none" onclick="location.href='write-community.html'">
      <i class="fa fa-pen"></i> 글쓰기
    </button>
  </div>
</div>

<div class="filter-wrap">
  <div class="filter-row">
    <button class="filter-btn active" onclick="setCategory('')">전체</button>
    <button class="filter-btn" onclick="setCategory('자랑')">🏆 자랑</button>
    <button class="filter-btn" onclick="setCategory('소통')">💬 소통</button>
    <button class="filter-btn" onclick="setCategory('질문')">❓ 질문</button>
    <button class="filter-btn" onclick="setCategory('정보')">📌 정보</button>
  </div>
</div>

<div class="section">
  <!-- 공지 영역 -->
  <div class="notice-area" id="noticeArea"></div>
  <!-- 게시글 목록 -->
  <div class="post-list" id="postList">
    <div class="loading">게시글을 불러오는 중...</div>
  </div>
  <button class="btn-more" id="moreBtn" style="display:none" onclick="loadMore()">게시글 더보기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="notifications.js"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb = window.supabase.createClient(SB_URL, SB_KEY, {
    auth: { persistSession: true, storageKey: 'freebuddy-auth', storage: window.localStorage }
  });

  var currentUser = null;
  var currentCategory = '';
  var PAGE_SIZE = 20;
  var offset = 0;
  var allLoaded = false;

  /* ── 인증 ── */
  async function checkAuth() {
    var res = await sb.auth.getUser();
    if (res.data && res.data.user) {
      currentUser = res.data.user;
      var pr = await sb.from('profiles').select('username').eq('id', currentUser.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = (pr.data && pr.data.username || '') + '님';
      document.getElementById('writeBtn').style.display = 'flex';
      initNotifications(sb, currentUser.id);
    }
  }

  window.logout = async function() { await sb.auth.signOut(); location.reload(); };

  /* ── 카테고리 필터 ── */
  window.setCategory = function(cat) {
    currentCategory = cat;
    offset = 0;
    allLoaded = false;
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      var label = btn.textContent.trim().replace(/^[^\s]+\s/, '');
      btn.classList.toggle('active', btn.textContent.includes('전체') ? cat === '' : btn.textContent.includes(cat));
    });
    document.getElementById('postList').innerHTML = '<div class="loading">불러오는 중...</div>';
    loadPosts(true);
  };

  /* ── 공지 로드 ── */
  async function loadNotices() {
    var res = await sb.from('posts')
      .select('id, title, created_at')
      .eq('category', '공지')
      .eq('is_pinned', true)
      .order('created_at', { ascending: false })
      .limit(3);

    var notices = res.data || [];
    var area = document.getElementById('noticeArea');
    if (notices.length === 0) { area.innerHTML = ''; return; }
    area.innerHTML = notices.map(function(n) {
      return `<div class="notice-item" onclick="location.href='community-detail.html?id=${n.id}'">
        <span class="notice-badge">📢 공지</span>
        <span class="notice-title">${escHtml(n.title)}</span>
        <span class="notice-date">${formatDate(n.created_at)}</span>
      </div>`;
    }).join('');
  }

  /* ── 게시글 로드 ── */
  async function loadPosts(reset) {
    if (reset) { offset = 0; allLoaded = false; }
    if (allLoaded) return;

    var now = new Date().toISOString();
    var query = sb.from('posts')
      .select('id, category, title, content, like_count, comment_count, view_count, hot_until, is_pinned, created_at, profiles(username)')
      .neq('category', '공지')
      .order('is_pinned', { ascending: false })
      .order('created_at', { ascending: false })
      .range(offset, offset + PAGE_SIZE - 1);

    if (currentCategory) query = query.eq('category', currentCategory);

    var res = await query;
    var posts = res.data || [];

    if (reset) {
      document.getElementById('postList').innerHTML = '';
    }

    if (posts.length === 0 && offset === 0) {
      document.getElementById('postList').innerHTML = `
        <div class="empty">
          <div class="empty-icon">✏️</div>
          <div class="empty-text">아직 게시글이 없어요.<br>첫 번째 글을 작성해보세요!</div>
        </div>`;
      document.getElementById('moreBtn').style.display = 'none';
      return;
    }

    var list = document.getElementById('postList');
    posts.forEach(function(p) {
      var isHot = p.hot_until && new Date(p.hot_until) > new Date();
      var card = document.createElement('div');
      card.className = 'post-card' + (isHot ? ' hot' : '');
      card.onclick = function() { location.href = 'community-detail.html?id=' + p.id; };
      var username = (p.profiles && p.profiles.username) || '?';
      card.innerHTML = `
        <div class="post-top">
          <span class="cat-badge cat-${p.category}">${p.category}</span>
          ${isHot ? '<span class="hot-badge">🔥 HOT</span>' : ''}
          <span class="post-title">${escHtml(p.title)}</span>
        </div>
        <div class="post-preview">${escHtml(p.content.replace(/\n/g,' ').substring(0,80))}</div>
        <div class="post-meta">
          <div class="post-author">
            <div class="post-author-avatar">${username[0]}</div>
            ${username}
          </div>
          <span class="post-time">${timeAgo(p.created_at)}</span>
          <div class="post-stats">
            <span class="post-stat">❤️ ${p.like_count || 0}</span>
            <span class="post-stat">💬 ${p.comment_count || 0}</span>
            <span class="post-stat">👁 ${p.view_count || 0}</span>
          </div>
        </div>`;
      list.appendChild(card);
    });

    offset += posts.length;
    allLoaded = posts.length < PAGE_SIZE;
    document.getElementById('moreBtn').style.display = allLoaded ? 'none' : 'block';
  }

  window.loadMore = function() { loadPosts(false); };

  /* ── 유틸 ── */
  function timeAgo(dateStr) {
    var diff = Math.floor((Date.now() - new Date(dateStr)) / 60000);
    if (diff < 1)    return '방금 전';
    if (diff < 60)   return diff + '분 전';
    if (diff < 1440) return Math.floor(diff/60) + '시간 전';
    return Math.floor(diff/1440) + '일 전';
  }
  function formatDate(dateStr) {
    var d = new Date(dateStr);
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function escHtml(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  checkAuth();
  loadNotices();
  loadPosts(true);
})();
</script>
</body>
</html>
