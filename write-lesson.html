<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 강습 개설하기</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-btns { display: flex; gap: 8px; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-ghost:hover { border-color: #1D9E75; color: #1D9E75; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .nav-user { display: none; align-items: center; gap: 12px; }

    .page-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .back-btn { width: 34px; height: 34px; border: 1px solid #e9ecef; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 14px; flex-shrink: 0; }
    .back-btn:hover { border-color: #1D9E75; color: #1D9E75; }
    .page-header h1 { font-size: 18px; font-weight: 700; color: #111; }

    .form-wrap { max-width: 640px; margin: 0 auto; padding: 28px 24px 60px; }

    /* 미리보기 */
    .preview-section { margin-bottom: 24px; }
    .preview-label { font-size: 11px; font-weight: 700; color: #bbb; letter-spacing: 0.05em; margin-bottom: 10px; }
    .preview-card { background: #fff; border: 1.5px solid #1D9E75; border-left: 5px solid #1D9E75; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(29,158,117,0.08); transition: border-color 0.3s; }
    .preview-card.scuba { border-color: #1565C0; box-shadow: 0 2px 12px rgba(21,101,192,0.08); }
    .instructor-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #f1f3f5; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .avatar.scuba { background: #e3f0ff; color: #1565C0; }
    .instructor-badge { margin-left: auto; font-size: 11px; font-weight: 700; background: #1D9E75; color: #fff; padding: 3px 10px; border-radius: 20px; }
    .instructor-badge.scuba { background: #1565C0; }
    .pv-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .pv-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .tag-free { background: #e8f8f2; color: #0F6E56; }
    .tag-scuba { background: #e3f0ff; color: #1565C0; }
    .tag-level { background: #f1f3f5; color: #555; }
    .pv-info { font-size: 13px; color: #555; line-height: 1.9; }
    .pv-price { font-size: 18px; font-weight: 700; color: #1D9E75; margin-top: 10px; }
    .pv-price.scuba { color: #1565C0; }
    .pv-note { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.6; }

    /* 폼 섹션 */
    .form-section { background: #fff; border: 1px solid #e9ecef; border-radius: 14px; padding: 22px 20px; margin-bottom: 14px; }
    .section-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 16px; display: flex; align-items: center; gap: 7px; }
    .section-title i { color: #1D9E75; font-size: 14px; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: #888; margin-bottom: 7px; }
    .field label .req { color: #1D9E75; margin-left: 2px; }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e0e3e7; border-radius: 10px; font-size: 14px; color: #222; background: #fff; font-family: inherit; transition: border-color 0.15s; outline: none; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #1D9E75; }
    .field textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-hint { font-size: 11px; color: #bbb; margin-top: 5px; }

    /* 종목 칩 */
    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 8px 18px; border: 1.5px solid #e0e3e7; border-radius: 20px; background: #fff; font-size: 13px; font-weight: 500; color: #666; cursor: pointer; transition: all 0.15s; }
    .chip:hover { border-color: #1D9E75; color: #1D9E75; }
    .chip.active { border-color: #1D9E75; background: #e8f8f2; color: #0F6E56; font-weight: 700; }
    .chip.scuba-active { border-color: #1565C0; background: #e3f0ff; color: #1565C0; font-weight: 700; }

    /* 제출 */
    .submit-area { margin-top: 24px; }
    .btn-submit { width: 100%; padding: 15px; background: #1D9E75; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: #178a65; }
    .btn-submit:disabled { background: #ccc; cursor: default; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #111; color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 999; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) { .nav-links { display: none; } .field-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link" style="color:#1D9E75">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div class="nav-user" id="navUser">
    <a href="my-page.html" id="navUsername" style="font-size:14px;color:#333;font-weight:500;text-decoration:none;cursor:pointer"></a>
    <button class="btn-ghost" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="page-header">
  <button class="back-btn" onclick="history.back()"><i class="fa fa-arrow-left"></i></button>
  <h1>강습 개설하기</h1>
</div>

<div class="form-wrap">

  <!-- 미리보기 -->
  <div class="preview-section">
    <div class="preview-label">📋 강습 카드 미리보기</div>
    <div class="preview-card" id="pvCard">
      <div class="instructor-row">
        <div class="avatar" id="pvAvatar">?</div>
        <div>
          <div style="font-size:15px;font-weight:700;color:#111" id="pvName">강사명</div>
          <div style="font-size:12px;color:#888;margin-top:2px" id="pvCert">자격증</div>
        </div>
        <span class="instructor-badge" id="pvBadge">강사</span>
      </div>
      <div class="pv-title" id="pvPool">풀장을 선택해주세요</div>
      <div class="pv-tags" id="pvTags">
        <span class="tag tag-free">🤿 프리다이빙</span>
      </div>
      <div class="pv-info" id="pvInfo">
        <div>📅 날짜 미정 &nbsp; ⏰ 시간 미정</div>
        <div>👥 최대 - 명</div>
      </div>
      <div class="pv-price" id="pvPrice">가격 협의</div>
      <div class="pv-note" id="pvNote" style="display:none"></div>
    </div>
  </div>

  <!-- 종목 -->
  <div class="form-section">
    <div class="section-title"><i class="fa fa-flag"></i> 종목</div>
    <div class="chip-group" id="sportChips">
      <button class="chip active" data-val="프리다이빙" onclick="setSport(this)">🤿 프리다이빙</button>
      <button class="chip" data-val="스쿠버다이빙" onclick="setSport(this)">🐠 스쿠버다이빙</button>
    </div>
  </div>

  <!-- 장소 -->
  <div class="form-section">
    <div class="section-title"><i class="fa fa-location-dot"></i> 장소</div>
    <div class="field">
      <label>풀장 선택 <span class="req">*</span></label>
      <select id="poolSelect" onchange="updatePreview()">
        <option value="">풀장을 선택하세요</option>
      </select>
    </div>
  </div>

  <!-- 일정 -->
  <div class="form-section">
    <div class="section-title"><i class="fa fa-calendar"></i> 일정</div>
    <div class="field-row">
      <div class="field">
        <label>날짜 <span class="req">*</span></label>
        <input type="date" id="dateInput" onchange="updatePreview()">
      </div>
      <div class="field">
        <label>집합 시간 <span class="req">*</span></label>
        <input type="time" id="timeInput" onchange="updatePreview()">
      </div>
    </div>
  </div>

  <!-- 강습 조건 -->
  <div class="form-section">
    <div class="section-title"><i class="fa fa-graduation-cap"></i> 강습 조건</div>
    <div class="field">
      <label>대상 레벨 <span class="req">*</span></label>
      <div class="chip-group" id="levelChips">
        <button class="chip" data-val="입문" onclick="setLevel(this)">입문</button>
        <button class="chip" data-val="레벨2" onclick="setLevel(this)">레벨2</button>
        <button class="chip" data-val="레벨3" onclick="setLevel(this)">레벨3</button>
        <button class="chip" data-val="레벨4" onclick="setLevel(this)">레벨4</button>
        <button class="chip" data-val="오픈워터" onclick="setLevel(this)" style="display:none">오픈워터</button>
        <button class="chip" data-val="어드밴스" onclick="setLevel(this)" style="display:none">어드밴스</button>
        <button class="chip" data-val="레스큐" onclick="setLevel(this)" style="display:none">레스큐</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>최대 수강 인원 <span class="req">*</span></label>
        <input type="number" id="maxStudents" min="1" max="20" placeholder="예: 4" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>수강료</label>
        <input type="text" id="priceInput" placeholder="예: 50,000원 또는 협의" oninput="updatePreview()">
      </div>
    </div>
    <div class="field">
      <label>한줄 소개 <span style="color:#ccc;font-weight:400">(선택)</span></label>
      <textarea id="noteInput" placeholder="예) 입문자 환영! 기초부터 차근차근 알려드립니다 :)" oninput="updatePreview()" maxlength="100"></textarea>
      <div class="field-hint" id="noteCount">0 / 100자</div>
    </div>
  </div>

  <!-- 연락 방법 -->
  <div class="form-section">
    <div class="section-title"><i class="fa fa-comment"></i> 연락 방법</div>
    <div class="field">
      <label>카카오 오픈채팅 링크 <span style="color:#ccc;font-weight:400">(선택)</span></label>
      <input type="url" id="chatLink" placeholder="https://open.kakao.com/o/..." oninput="updatePreview()">
      <div class="field-hint">링크가 없으면 댓글로 문의할 수 있어요</div>
    </div>
  </div>

  <!-- 제출 -->
  <div class="submit-area">
    <button class="btn-submit" id="submitBtn" onclick="submitLesson()">
      <i class="fa fa-chalkboard-teacher"></i> 강습 개설하기
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  var SB_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  var sb;
  var currentUser = null;
  var currentProfile = null;
  var currentSport = '프리다이빙';
  var currentLevel = '';
  var pools = [];

  function initSB() {
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      sb = window.supabase.createClient(SB_URL, SB_KEY);
      checkAuth();
      loadPools();
    } else { setTimeout(initSB, 100); }
  }

  async function checkAuth() {
    var res = await sb.auth.getUser();
    if (res.data && res.data.user) {
      currentUser = res.data.user;
      var pr = await sb.from('profiles').select('username, license_type, license_level').eq('id', currentUser.id).single();
      currentProfile = pr.data || {};
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = (currentProfile.username || '') + '님';
      updatePreview();
    }
  }

  window.logout = async function() { await sb.auth.signOut(); location.reload(); };

  async function loadPools() {
    var res = await sb.from('pools').select('id, name, region').order('region');
    pools = res.data || [];
    var sel = document.getElementById('poolSelect');
    var groups = {};
    pools.forEach(function(p) { if (!groups[p.region]) groups[p.region] = []; groups[p.region].push(p); });
    var html = '<option value="">풀장을 선택하세요</option>';
    Object.keys(groups).forEach(function(r) {
      html += '<optgroup label="' + r + '">';
      groups[r].forEach(function(p) { html += '<option value="' + p.id + '" data-name="' + p.name + '" data-region="' + p.region + '">' + p.name + '</option>'; });
      html += '</optgroup>';
    });
    sel.innerHTML = html;
  }

  window.setSport = function(btn) {
    document.querySelectorAll('#sportChips .chip').forEach(function(c) { c.classList.remove('active','scuba-active'); });
    var isScuba = btn.dataset.val === '스쿠버다이빙';
    btn.classList.add(isScuba ? 'scuba-active' : 'active');
    currentSport = btn.dataset.val;
    // 레벨 칩 전환
    var freeLevels = ['입문','레벨2','레벨3','레벨4'];
    var scubaLevels = ['오픈워터','어드밴스','레스큐'];
    document.querySelectorAll('#levelChips .chip').forEach(function(c) {
      var v = c.dataset.val;
      c.style.display = isScuba ? (scubaLevels.includes(v) ? '' : 'none') : (freeLevels.includes(v) ? '' : 'none');
      c.classList.remove('active','scuba-active');
    });
    currentLevel = '';
    updatePreview();
  };

  window.setLevel = function(btn) {
    document.querySelectorAll('#levelChips .chip').forEach(function(c) { c.classList.remove('active','scuba-active'); });
    var isScuba = currentSport === '스쿠버다이빙';
    btn.classList.add(isScuba ? 'scuba-active' : 'active');
    currentLevel = btn.dataset.val;
    updatePreview();
  };

  document.getElementById('noteInput').addEventListener('input', function() {
    document.getElementById('noteCount').textContent = this.value.length + ' / 100자';
  });

  window.updatePreview = function() {
    var isScuba = currentSport === '스쿠버다이빙';
    var name = (currentProfile && currentProfile.username) || '강사명';
    var cert = (currentProfile && currentProfile.license_type) ? currentProfile.license_type + ' ' + (currentProfile.license_level || '') : '자격증';

    document.getElementById('pvAvatar').textContent = name[0];
    document.getElementById('pvAvatar').className = 'avatar' + (isScuba ? ' scuba' : '');
    document.getElementById('pvName').textContent = name + ' 강사';
    document.getElementById('pvCert').textContent = cert;
    document.getElementById('pvCard').className = 'preview-card' + (isScuba ? ' scuba' : '');
    document.getElementById('pvBadge').className = 'instructor-badge' + (isScuba ? ' scuba' : '');
    document.getElementById('pvPrice').className = 'pv-price' + (isScuba ? ' scuba' : '');

    var sel = document.getElementById('poolSelect');
    var opt = sel.options[sel.selectedIndex];
    var poolName = (opt && opt.value) ? (opt.dataset.name || opt.text) : '풀장을 선택해주세요';
    var region   = (opt && opt.value) ? (opt.dataset.region || '') : '';
    document.getElementById('pvPool').textContent = '📍 ' + poolName + (region ? ' · ' + region : '');

    var sportLabel = isScuba ? '🐠 스쿠버다이빙' : '🤿 프리다이빙';
    var tagCls = isScuba ? 'tag-scuba' : 'tag-free';
    document.getElementById('pvTags').innerHTML =
      '<span class="tag ' + tagCls + '">' + sportLabel + '</span>' +
      (currentLevel ? '<span class="tag tag-level">' + currentLevel + '</span>' : '');

    var d = document.getElementById('dateInput').value;
    var t = document.getElementById('timeInput').value;
    var m = document.getElementById('maxStudents').value;
    document.getElementById('pvInfo').innerHTML =
      '<div>📅 ' + (d || '날짜 미정') + ' &nbsp; ⏰ ' + (t || '시간 미정') + '</div>' +
      '<div>👥 최대 ' + (m || '-') + '명</div>';

    var price = document.getElementById('priceInput').value;
    document.getElementById('pvPrice').textContent = price || '가격 협의';

    var note = document.getElementById('noteInput').value;
    var pvNote = document.getElementById('pvNote');
    if (note) { pvNote.style.display = ''; pvNote.textContent = '📝 ' + note; }
    else { pvNote.style.display = 'none'; }
  };

  window.submitLesson = async function() {
    if (!currentUser) {
      if (confirm('로그인이 필요합니다. 로그인 하시겠습니까?')) location.href = 'login.html';
      return;
    }
    var poolId = document.getElementById('poolSelect').value;
    var date   = document.getElementById('dateInput').value;
    var time   = document.getElementById('timeInput').value;
    var max    = document.getElementById('maxStudents').value;
    if (!poolId) { showToast('풀장을 선택해주세요'); return; }
    if (!date || !time) { showToast('날짜와 집합 시간을 입력해주세요'); return; }
    if (!currentLevel) { showToast('대상 레벨을 선택해주세요'); return; }
    if (!max) { showToast('최대 수강 인원을 입력해주세요'); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 등록 중...';

    var res = await sb.from('lessons').insert({
      instructor_id: currentUser.id,
      pool_id:       parseInt(poolId),
      sport:         currentSport,
      level:         currentLevel,
      date:          date,
      time_slot:     time,
      max_students:  parseInt(max),
      price:         document.getElementById('priceInput').value || null,
      note:          document.getElementById('noteInput').value  || null,
      contact:       document.getElementById('chatLink').value   || null,
    });

    if (res.error) {
      showToast('오류: ' + res.error.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-chalkboard-teacher"></i> 강습 개설하기';
      return;
    }
    showToast('✅ 강습이 등록됐습니다!');
    setTimeout(function() { location.href = 'lessons.html'; }, 1200);
  };

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
  updatePreview();
  initSB();
})();
</script>
</body>
</html>
