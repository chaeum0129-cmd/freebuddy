<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeBuddy - 풀장 상세</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8f9fa; color: #222; }
    a { text-decoration: none; color: inherit; }
    nav { background: #fff; border-bottom: 1px solid #e9ecef; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .logo span { color: #222; }
    .nav-links { display: flex; gap: 24px; }
    .nav-link { font-size: 14px; color: #555; font-weight: 500; }
    .nav-btns { display: flex; gap: 8px; }
    .btn-ghost { padding: 7px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; color: #333; cursor: pointer; font-weight: 500; }
    .btn-primary { padding: 7px 16px; border: none; border-radius: 8px; background: #1D9E75; font-size: 13px; color: #fff; cursor: pointer; font-weight: 500; }
    .nav-user { display: none; align-items: center; gap: 12px; }
    .nav-user span { font-size: 14px; color: #333; font-weight: 500; }
    .breadcrumb { padding: 12px 24px; font-size: 13px; color: #aaa; max-width: 960px; margin: 0 auto; }
    .breadcrumb a { color: #1D9E75; }
    .pool-header { background: #fff; border-bottom: 1px solid #e9ecef; padding: 20px 24px; }
    .pool-header-inner { max-width: 960px; margin: 0 auto; }
    .pool-title-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .pool-title { font-size: 22px; font-weight: 700; color: #111; }
    .region-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: #1D9E75; color: #fff; font-weight: 600; white-space: nowrap; margin-left: 12px; }
    .pool-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .pool-tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #f1f3f5; color: #555; }
    .hours-box { background: #f8f9fa; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #555; line-height: 1.8; }
    .hours-title { font-size: 12px; font-weight: 700; color: #888; margin-bottom: 4px; }
    .hours-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .hours-grid { grid-template-columns: 1fr; } }
    .ad-banner { margin: 16px auto; max-width: 960px; padding: 0 24px; }
    .ad-box { height: 72px; background: #f1f3f5; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .ad-label { font-size: 11px; color: #999; }
    .ad-badge { font-size: 11px; color: #854F0B; background: #FAEEDA; padding: 2px 8px; border-radius: 4px; }
    .two-col { max-width: 960px; margin: 0 auto; padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } .nav-links { display: none; } }
    .col-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 14px; }
    .calendar { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 16px; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-month { font-size: 14px; font-weight: 700; color: #111; }
    .cal-nav button { background: none; border: 1px solid #e9ecef; border-radius: 6px; padding: 4px 10px; font-size: 14px; color: #555; cursor: pointer; margin-left: 4px; }
    .cal-nav button:hover { border-color: #1D9E75; color: #1D9E75; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-hdr { text-align: center; font-size: 11px; color: #aaa; padding: 4px 0 8px; font-weight: 600; }
    .cal-day { text-align: center; font-size: 13px; padding: 6px 4px; border-radius: 6px; cursor: pointer; color: #555; }
    .cal-day:hover { background: #f1f3f5; }
    .cal-day.has-buddy { color: #0F6E56; font-weight: 700; background: #e8f8f2; }
    .cal-day.selected { background: #1D9E75 !important; color: #fff !important; font-weight: 700; }
    .cal-day.today { border: 2px solid #1D9E75; color: #1D9E75; font-weight: 700; }
    .cal-day.past { color: #ccc; cursor: default; }
    .cal-day.empty { cursor: default; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: #1D9E75; margin: 2px auto 0; }
    .buddy-write-panel { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 16px; }
    .date-label { font-size: 13px; color: #888; margin-bottom: 16px; }
    .date-label strong { color: #1D9E75; }
    .buddy-count-box { background: #f8f9fa; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: #555; }
    .buddy-count-num { font-size: 20px; font-weight: 700; color: #1D9E75; }
    .btn-write { width: 100%; padding: 12px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-write:hover { background: #178a65; }
    .divider { max-width: 960px; margin: 0 auto; height: 1px; background: #e9ecef; }
    .buddy-section { max-width: 960px; margin: 0 auto; padding: 24px; }
    .buddy-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .buddy-section-title { font-size: 16px; font-weight: 700; color: #111; }
    .buddy-list { display: flex; flex-direction: column; gap: 10px; }
    .buddy-card { background: #fff; border: 1px solid #e9ecef; border-radius: 12px; padding: 14px 18px; }
    .buddy-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .buddy-user { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8f8f2; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #0F6E56; flex-shrink: 0; }
    .buddy-username { font-size: 14px; font-weight: 600; color: #111; }
    .level-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #EEEDFE; color: #3C3489; font-weight: 500; }
    .buddy-info-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .buddy-info-item { font-size: 12px; color: #888; }
    .btn-contact { font-size: 12px; padding: 6px 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #333; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .btn-contact:hover { border-color: #1D9E75; color: #1D9E75; }
    .empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
    .modal-bg.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 90%; max-width: 420px; }
    .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; color: #111; }
    .modal .modal-sub { font-size: 12px; color: #aaa; margin-bottom: 20px; }
    .modal .form-group { margin-bottom: 14px; }
    .modal label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .modal input, .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; color: #222; }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: #1D9E75; }
    .modal textarea { resize: vertical; min-height: 70px; }
    .modal-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btns button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-cancel { border: 1px solid #ddd; background: #fff; color: #555; }
    .btn-ok { border: none; background: #1D9E75; color: #fff; }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Free<span>Buddy</span></a>
  <div class="nav-links">
    <a href="pools.html" class="nav-link">풀장 찾기</a>
    <a href="buddy.html" class="nav-link">버디 구하기</a>
    <a href="lessons.html" class="nav-link">강습</a>
  </div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-ghost" onclick="location.href='login.html'">로그인</button>
    <button class="btn-primary" onclick="location.href='signup.html'">회원가입</button>
  </div>
  <div class="nav-user" id="navUser">
    <span id="navUsername"></span>
    <button class="btn-ghost" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="breadcrumb">
  <a href="pools.html">풀장 목록</a> &rsaquo; <span id="breadPool">풀장</span>
</div>

<div class="pool-header">
  <div class="pool-header-inner">
    <div class="pool-title-row">
      <div class="pool-title" id="poolName">불러오는 중...</div>
      <span class="region-badge" id="poolRegion"></span>
    </div>
    <div class="pool-tags" id="poolTags"></div>
    <div class="hours-grid" id="hoursGrid" style="display:none">
      <div class="hours-box">
        <div class="hours-title">📅 평일 운영시간</div>
        <div id="weekdayHours"></div>
      </div>
      <div class="hours-box">
        <div class="hours-title">🎉 주말 운영시간</div>
        <div id="weekendHours"></div>
      </div>
    </div>
  </div>
</div>

<div class="ad-banner">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense — 풀장 상세 상단</span>
  </div>
</div>

<div class="two-col">
  <div>
    <div class="col-title">날짜 선택</div>
    <div class="calendar">
      <div class="cal-header">
        <span class="cal-month" id="calMonth"></span>
        <div class="cal-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <button onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
  <div>
    <div class="col-title">버디 모집</div>
    <div class="buddy-write-panel">
      <div class="date-label" id="dateLabel">날짜를 선택해주세요</div>
      <div class="buddy-count-box" id="buddyCountBox" style="display:none">
        이 날 버디 모집 중: <span class="buddy-count-num" id="buddyCount">0</span>명
      </div>
      <button class="btn-write" onclick="openBuddyModal()">버디 구하기 등록</button>
    </div>
  </div>
</div>

<div class="divider"></div>

<div class="buddy-section">
  <div class="buddy-section-header">
    <span class="buddy-section-title" id="buddySectionTitle">버디 모집 현황</span>
  </div>
  <div class="buddy-list" id="buddyList">
    <div class="empty">날짜를 선택하면 버디 현황이 표시됩니다</div>
  </div>
</div>

<div class="ad-banner" style="margin-bottom:32px">
  <div class="ad-box">
    <span class="ad-badge">광고</span>
    <span class="ad-label">Google AdSense — 버디 목록 하단</span>
  </div>
</div>

<!-- 버디 모집 모달 -->
<div class="modal-bg" id="buddyModal">
  <div class="modal">
    <h3>버디 구하기 등록</h3>
    <p class="modal-sub" id="modalDateLabel"></p>
    <div class="form-group">
      <label>시간 입력</label>
      <input type="text" id="modalTimeSlot" placeholder="예: 2타임 (11:00~13:00) 또는 오전 10시~12시">
      <div class="modal-hint" id="poolHoursHint"></div>
    </div>
    <div class="form-group">
      <label>연락처 (카카오 오픈채팅 링크 등)</label>
      <input type="text" id="modalContact" placeholder="연락 방법을 입력해주세요">
    </div>
    <div class="form-group">
      <label>메모 (선택)</label>
      <textarea id="modalNote" placeholder="원하는 레벨, 참고사항 등을 자유롭게 입력해주세요"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeBuddyModal()">취소</button>
      <button class="btn-ok" onclick="submitBuddyPost()">등록하기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://hlyxoibjbgrzenojrpbn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXhvaWJqYmdyemVub2pycGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MzY5NjgsImV4cCI6MjEwNDQxMjk2OH0.9NvqzszqoxYMN7uhGyyGtEXBtA0IF3ph-rRuUxahP2A';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const poolId = new URLSearchParams(window.location.search).get('id');
  let currentUser = null;
  let selectedDate = null;
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let buddyDates = [];
  let poolData = null;

  async function checkAuth() {
    const { data: { user } } = await supabase.auth.getUser();
    currentUser = user;
    if (user) {
      const { data: profile } = await supabase.from('profiles').select('username').eq('id', user.id).single();
      document.getElementById('navBtns').style.display = 'none';
      document.getElementById('navUser').style.display = 'flex';
      document.getElementById('navUsername').textContent = (profile?.username || '') + '님';
    }
  }

  async function logout() { await supabase.auth.signOut(); location.reload(); }

  async function loadPool() {
    const { data: pool } = await supabase.from('pools').select('*').eq('id', poolId).single();
    if (!pool) return;
    poolData = pool;
    document.title = `FreeBuddy - ${pool.name}`;
    document.getElementById('breadPool').textContent = pool.name;
    document.getElementById('poolName').textContent = pool.name;
    document.getElementById('poolRegion').textContent = pool.region;

    const tags = [];
    if (pool.address) tags.push('📍 ' + pool.address);
    if (pool.depth) tags.push('🏊 ' + pool.depth);
    document.getElementById('poolTags').innerHTML = tags.map(t => `<span class="pool-tag">${t}</span>`).join('');

    if (pool.weekday_hours || pool.weekend_hours) {
      document.getElementById('hoursGrid').style.display = 'grid';
      document.getElementById('weekdayHours').textContent = pool.weekday_hours || '-';
      document.getElementById('weekendHours').textContent = pool.weekend_hours || '-';
    }
  }

  async function loadBuddyDates() {
    const { data } = await supabase.from('buddy_posts').select('date').eq('pool_id', poolId);
    buddyDates = (data || []).map(d => d.date);
    renderCalendar();
  }

  function renderCalendar() {
    const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('calMonth').textContent = `${calYear}년 ${monthNames[calMonth]}`;
    const grid = document.getElementById('calGrid');
    const days = ['일','월','화','수','목','금','토'];
    let html = days.map(d => `<div class="cal-day-hdr">${d}</div>`).join('');
    const first = new Date(calYear, calMonth, 1).getDay();
    const total = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date();
    for (let i = 0; i < first; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= total; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
      const hasBuddy = buddyDates.includes(dateStr);
      const isPast = new Date(calYear, calMonth, d) < new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const isSelected = selectedDate === dateStr;
      let cls = 'cal-day';
      if (isPast) cls += ' past';
      else if (isSelected) cls += ' selected';
      else if (hasBuddy) cls += ' has-buddy';
      else if (isToday) cls += ' today';
      const dot = hasBuddy && !isSelected ? '<div class="dot"></div>' : '';
      const click = isPast ? '' : `onclick="selectDate('${dateStr}')"`;
      html += `<div class="${cls}" ${click}>${d}${dot}</div>`;
    }
    grid.innerHTML = html;
  }

  function changeMonth(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  }

  async function selectDate(dateStr) {
    selectedDate = dateStr;
    renderCalendar();
    const dateObj = new Date(dateStr);
    const dateLabel = dateObj.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
    const isWeekend = [0, 6].includes(dateObj.getDay());

    document.getElementById('dateLabel').innerHTML = `<strong>${dateLabel}</strong> 버디 현황`;

    const { data: posts } = await supabase.from('buddy_posts').select('*').eq('pool_id', poolId).eq('date', dateStr);
    const count = (posts || []).length;
    document.getElementById('buddyCountBox').style.display = 'block';
    document.getElementById('buddyCount').textContent = count;

    document.getElementById('buddySectionTitle').textContent = `${dateLabel} 버디 모집 현황`;
    loadBuddyPosts(dateStr);

    // 모달 힌트 업데이트
    const hoursHint = isWeekend
      ? (poolData?.weekend_hours ? '주말 운영: ' + poolData.weekend_hours : '')
      : (poolData?.weekday_hours ? '평일 운영: ' + poolData.weekday_hours : '');
    document.getElementById('poolHoursHint').textContent = hoursHint;
    document.getElementById('modalDateLabel').textContent = dateLabel + ' 버디 모집';
  }

  async function loadBuddyPosts(date) {
    const { data: posts } = await supabase
      .from('buddy_posts')
      .select('*, profiles(username, license_type, license_level)')
      .eq('pool_id', poolId)
      .eq('date', date)
      .order('created_at', { ascending: false });

    const list = document.getElementById('buddyList');
    if (!posts || posts.length === 0) {
      list.innerHTML = '<div class="empty">이 날 버디 모집이 없습니다<br>먼저 등록해보세요!</div>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <div class="buddy-card">
        <div class="buddy-card-top">
          <div class="buddy-user">
            <div class="avatar">${(p.profiles?.username || '?')[0]}</div>
            <span class="buddy-username">${p.profiles?.username || ''}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="level-badge">${p.profiles?.license_type || ''} ${p.profiles?.license_level || ''}</span>
            <button class="btn-contact" onclick="contactBuddy('${p.contact || ''}', '${p.profiles?.username || ''}')">연락하기</button>
          </div>
        </div>
        <div class="buddy-info-row">
          <span class="buddy-info-item">⏰ ${p.time_slot}</span>
          ${p.note ? `<span class="buddy-info-item">📝 ${p.note}</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  function contactBuddy(contact, username) {
    if (!currentUser) {
      if (confirm('로그인이 필요합니다. 로그인 하시겠습니까?')) location.href = 'login.html';
      return;
    }
    if (contact) window.open(contact, '_blank');
    else alert(`${username}님의 연락처가 등록되지 않았습니다`);
  }

  function openBuddyModal() {
    if (!currentUser) {
      if (confirm('로그인이 필요합니다. 로그인 하시겠습니까?')) location.href = 'login.html';
      return;
    }
    if (!selectedDate) { alert('날짜를 먼저 선택해주세요'); return; }
    document.getElementById('buddyModal').classList.add('show');
  }

  function closeBuddyModal() {
    document.getElementById('buddyModal').classList.remove('show');
  }

  async function submitBuddyPost() {
    const timeSlot = document.getElementById('modalTimeSlot').value.trim();
    const contact = document.getElementById('modalContact').value.trim();
    const note = document.getElementById('modalNote').value.trim();

    if (!timeSlot) { alert('시간을 입력해주세요'); return; }

    const { error } = await supabase.from('buddy_posts').insert({
      user_id: currentUser.id,
      pool_id: poolId,
      date: selectedDate,
      time_slot: timeSlot,
      contact,
      note
    });

    if (error) { alert('등록 중 오류가 발생했습니다'); return; }

    closeBuddyModal();
    document.getElementById('modalTimeSlot').value = '';
    document.getElementById('modalContact').value = '';
    document.getElementById('modalNote').value = '';
    alert('버디 모집 등록이 완료됐습니다!');
    loadBuddyDates();
    selectDate(selectedDate);
  }

  checkAuth();
  loadPool();
  loadBuddyDates();
</script>
</body>
</html>
